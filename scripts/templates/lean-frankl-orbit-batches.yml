name: Lean Frankl orbit arithmetic batches

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Optional comma-separated group IDs, such as g00,g01; blank checks all groups'
        required: false
        type: string
  push:
    paths:
      - 'lean/Conjectures/Frankl*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'results/frankl-generator-families/generate_small_cyclic_weight_orbit_batches.py'
      - 'results/frankl-generator-families/small_cyclic_weight_orbit_batches.json'
      - 'results/frankl-generator-families/small_cyclic_weight_orbits.json.gz'
      - 'results/frankl-generator-families/width_four_weight_candidates.json'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/test_frankl_orbit_batches.py'
      - 'scripts/replay_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/verify_lean_candidate.py'
      - '.github/workflows/lean-frankl-orbit-batches.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/Frankl*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'results/frankl-generator-families/generate_small_cyclic_weight_orbit_batches.py'
      - 'results/frankl-generator-families/small_cyclic_weight_orbit_batches.json'
      - 'results/frankl-generator-families/small_cyclic_weight_orbits.json.gz'
      - 'results/frankl-generator-families/width_four_weight_candidates.json'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/test_frankl_orbit_batches.py'
      - 'scripts/replay_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/verify_lean_candidate.py'
      - '.github/workflows/lean-frankl-orbit-batches.yml'

permissions:
  contents: read

jobs:
  plan:
    name: Select bounded orbit arithmetic groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check complete partition and group selection
        run: python3 -m unittest discover -s scripts -p test_frankl_orbit_batches.py
      - id: plan
        env:
          REQUESTED_GROUPS: ${{ github.event.inputs.groups || '' }}
        run: python3 scripts/verify_frankl_orbit_batches.py --plan-ci
  candidates:
    name: Orbit arithmetic ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Rebuild isolated sources, audit all declarations, replay exact closure
        run: python3 scripts/verify_frankl_orbit_batches.py '${{ matrix.group }}' --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-orbit-${{ matrix.group }}-receipt
          path: .candidate-artifacts/frankl-orbit-${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 7
