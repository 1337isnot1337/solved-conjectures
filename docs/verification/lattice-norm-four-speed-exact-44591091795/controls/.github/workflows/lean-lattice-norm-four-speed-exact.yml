permissions:
  contents: read

concurrency:
  group: lean-lattice-norm-four-speed-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source and control inventory
        run: |
          python3 -m py_compile scripts/verify_lattice_norm_four_speed_exact.py
          python3 scripts/verify_lattice_norm_four_speed_exact.py bounds --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict sources, all-owned audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_lattice_norm_four_speed_exact.py bounds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lattice-norm-four-speed-bounds
          path: .candidate-artifacts/lattice-norm-four-speed-bounds/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
