name: Lean six-speed spectrum realization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-six-spectrum-realization.yml'
      - 'scripts/verify_six_spectrum_realization.py'
      - 'docs/six-spectrum-realization-sources.json'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessCertificate.lean'
      - 'lean/Conjectures/LonelinessExamples.lean'
      - 'lean/Conjectures/LonelinessPairBridge.lean'
      - 'lean/Conjectures/LonelinessMax.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessConsecutiveFamily.lean'
      - 'lean/Conjectures/LonelinessConsecutiveFamilyCertificates.lean'
      - 'lean/Conjectures/LonelinessSixProgression.lean'
      - 'lean/Conjectures/LonelinessSixSpectrumRealization.lean'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/replay_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

concurrency:
  group: lean-six-spectrum-realization
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact source and helper inventory
        run: |
          python3 -m py_compile scripts/verify_six_spectrum_realization.py
          python3 scripts/verify_six_spectrum_realization.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, all-owned private audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_six_spectrum_realization.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-spectrum-realization
          path: .candidate-artifacts/six-spectrum-realization/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
