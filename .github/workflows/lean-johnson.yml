name: Johnson's conjecture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lean/Conjectures/JohnsonPfaffian*.lean'
      - 'scripts/verify_lean_target.py'
      - '.github/workflows/lean-johnson.yml'
  push:
    branches: [research, main]
    paths:
      - 'lean/Conjectures/JohnsonPfaffian*.lean'
      - 'scripts/verify_lean_target.py'
      - '.github/workflows/lean-johnson.yml'
      - 'lean/lean-toolchain'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Strict source, all-owned audit, and stock-kernel replay
        run: >-
          python3 scripts/verify_lean_target.py
          --root Conjectures.JohnsonPfaffian
          --require JohnsonPfaffian.johnson_conjecture
          --require JohnsonPfaffian.johnson_conjecture_arbitrary_matching
          --require JohnsonPfaffian.johnson_conjecture_fin
          --require JohnsonPfaffian.CircularData.matching_bound
          --require JohnsonPfaffian.CircularData.endpoint_bound
          --require JohnsonPfaffian.CircularData.noncrossing_bound
          --require JohnsonPfaffian.exists_noncrossing_dominating
          --require JohnsonPfaffian.sourceKernelData_weight
          --out .candidate-artifacts/johnson
      - uses: actions/upload-artifact@v4
        with:
          name: johnson
          path: .candidate-artifacts/johnson/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
