name: Preserve complete initial-graph proof evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preserve-frankl-full-graph.yml'
      - 'scripts/preserve_frankl_full_graph.py'

permissions:
  actions: read
  contents: write

concurrency:
  group: preserve-frankl-full-graph-44518872729
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check fixed-exporter syntax and rejection fixtures
        run: |
          python3 -m py_compile scripts/preserve_frankl_full_graph.py
          python3 scripts/preserve_frankl_full_graph.py --self-test
      - name: Authenticate the original archive and preserve unchanged evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/preserve_frankl_full_graph.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-full-graph-preservation
          path: .candidate-artifacts/frankl-full-graph-preservation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
