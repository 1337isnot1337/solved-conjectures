name: Preserve exact two-insertion proof evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preserve-two-insertions-exact.yml'
      - 'scripts/preserve_two_insertions_exact.py'

permissions:
  actions: read
  contents: write

concurrency:
  group: preserve-two-insertions-exact-44524198858
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check fixed-exporter syntax and rejection fixtures
        run: |
          python3 -m py_compile scripts/preserve_two_insertions_exact.py
          python3 scripts/preserve_two_insertions_exact.py --self-test
      - name: Authenticate the original archive and preserve unchanged evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/preserve_two_insertions_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-insertions-exact-preservation
          path: .candidate-artifacts/two-insertions-preservation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
