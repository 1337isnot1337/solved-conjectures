name: Lean runner endpoint and quantitative candidates

on:
  workflow_dispatch:
  push:
    paths:
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_loneliness_final_extensions.py'
      - 'scripts/verify_loneliness_geometry.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - '.github/workflows/lean-loneliness-final-extensions.yml'
      - '.github/workflows/lean-loneliness-geometry.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_loneliness_final_extensions.py'
      - 'scripts/verify_loneliness_geometry.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - '.github/workflows/lean-loneliness-final-extensions.yml'
      - '.github/workflows/lean-loneliness-geometry.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    name: Select affected endpoint and quantitative candidates
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/verify_loneliness_final_extensions.py --plan-ci

  verify:
    name: Runner extension ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Build, audit axioms, and replay the exact project closure
        run: python3 scripts/verify_loneliness_final_extensions.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-final-extension-${{ matrix.task }}
          path: .candidate-artifacts/geometry-${{ matrix.task }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
