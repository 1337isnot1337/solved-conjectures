name: verify conjecture results
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify L-solitaire exhaustive finite checks
        run: python3 l-solitaire-limit-shapes/verify.py
      - name: Verify Pham exact main and dual certificates
        run: |
          python3 pham-denominator-degree/verify.py
          python3 pham-denominator-degree/verify.py --dual --brute-depth 13
      - name: Run Pham regression tests
        run: cd pham-denominator-degree && python3 -m unittest discover -s tests -v
      - name: Verify Li non-spider coefficient and partition certificates
        run: |
          python3 li-coefficient-sign/verify.py
          python3 li-coefficient-sign/independent_check.py
      - name: Verify Batista Egyptian-fraction congruence checks
        run: python3 batista-egyptian-fractions/verify.py
      - name: Verify the line-size generating function
        run: python3 erdos-607-line-sizes/verify.py
      - name: Verify rectangle packing and multiset recovery
        run: python3 rectangle-partition-asymptotics/verify.py
      - name: Replay standard three-player War deals
        run: python3 spivey-multiplayer-war/verify.py
      - name: Check the CUT Family B threshold against the game rules
        run: python3 cut-family-b/verify.py
      - name: Prove the two ultimate CUT periods by automata
        run: python3 cut-arithmetic-periodicity/verify.py
      - name: Verify both distance-graph density results
        run: |
          c++ -std=c++20 -O3 distance-graph-densities/verify.cpp -o /tmp/verify-distance-graphs
          /tmp/verify-distance-graphs
          python3 distance-graph-densities/counterexample.py
