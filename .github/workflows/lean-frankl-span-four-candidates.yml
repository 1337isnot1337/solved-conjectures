name: Lean Frankl span-four candidate proofs

on:
  workflow_dispatch:
    inputs:
      task:
        description: Candidate component to verify
        type: choice
        default: auto
        options:
          - auto
          - assembly
          - schedule
          - admissible
          - cyclic-injective
          - irredundant
          - assembly-core
          - family-transfer
          - weight-rows
          - weight-batches
          - small-cyclic-weights-pilot
          - word-coverage
  push:
    paths:
      - 'lean/Conjectures/Frankl*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'docs/frankl-span-four-source-inventory.json'
      - 'scripts/verify_frankl_span_four_candidate.py'
      - 'scripts/test_frankl_span_four_candidate.py'
      - 'scripts/verify_frankl_fc_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_line_size_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-frankl-span-four-candidates.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/Frankl*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'docs/frankl-span-four-source-inventory.json'
      - 'scripts/verify_frankl_span_four_candidate.py'
      - 'scripts/test_frankl_span_four_candidate.py'
      - 'scripts/verify_frankl_fc_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_line_size_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-frankl-span-four-candidates.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    name: Select affected span-four components
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check selection, missing-source reporting and exact replay guards
        run: python3 -m unittest discover -s scripts -p test_frankl_span_four_candidate.py -v
      - id: plan
        env:
          SELECTED_TASK: ${{ inputs.task }}
        run: |
          if [ -n "$SELECTED_TASK" ] && [ "$SELECTED_TASK" != auto ]; then
            python3 scripts/verify_frankl_span_four_candidate.py "$SELECTED_TASK" --plan-ci
          else
            python3 scripts/verify_frankl_span_four_candidate.py --plan-ci
          fi
  candidates:
    name: Frankl span-four candidate ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Require every reviewed source before installing Lean
        run: python3 scripts/verify_frankl_span_four_candidate.py '${{ matrix.task }}' --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Rebuild, audit and replay the exact source closure
        run: python3 scripts/verify_frankl_span_four_candidate.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-span-four-${{ matrix.task }}-receipt
          path: .candidate-artifacts/frankl-span-four-${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 7
