name: Preserve exact Frankl component receipts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frankl-component-receipts.yml'
      - 'scripts/preserve_frankl_component_receipts.py'
  workflow_run:
    workflows:
      - Lean Frankl family relabeling
      - Lean Frankl full high-girth generator theorem
      - Lean Frankl actual high-girth graph counts
      - Lean Frankl actual tree configuration messages
      - Lean Frankl boundary configuration and averaging
      - Lean Frankl boundary configuration fibers
      - Lean Frankl literal ten-point weight bridge
      - Lean Frankl actual tree configuration counts
      - Lean Frankl graph-ball recursive unfolding
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original proof evidence and preserve exact component receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_frankl_component_receipts.py
