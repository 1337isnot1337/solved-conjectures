name: Lean seven-spectrum norm and prime reduction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-seven-spectrum-norm-exact.yml'
      - 'scripts/verify_seven_spectrum_norm_exact.py'
      - 'docs/seven-spectrum-norm-exact-sources.json'
      - 'lean/Conjectures/LonelinessSevenSpectrumNormGeometry.lean'

permissions:
  contents: read

concurrency:
  group: lean-seven-spectrum-norm-exact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact proof and helper inventory
        run: |
          python3 -m py_compile scripts/verify_seven_spectrum_norm_exact.py
          python3 scripts/verify_seven_spectrum_norm_exact.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict sources, all-owned audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_seven_spectrum_norm_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-spectrum-norm-exact
          path: .candidate-artifacts/seven-spectrum-norm/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
