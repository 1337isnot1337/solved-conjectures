name: README verification

on:
  push:
    paths:
      - README.md
      - scripts/check_readme_verification.py
      - .github/workflows/readme-verification.yml
  pull_request:
    paths:
      - README.md
      - scripts/check_readme_verification.py
      - .github/workflows/readme-verification.yml

permissions:
  contents: read

jobs:
  verification-emojis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README verification emojis
        run: python3 scripts/check_readme_verification.py
