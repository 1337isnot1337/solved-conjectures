name: Lean candidate proofs

on:
  workflow_dispatch:
  push:
    paths:
      - 'lean/Conjectures/Graffiti318*.lean'
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - '.github/workflows/lean-candidates.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/Graffiti318*.lean'
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - '.github/workflows/lean-candidates.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    name: Select affected candidate proofs
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.plan.outputs.components }}
      four: ${{ steps.plan.outputs.four }}
      kz: ${{ steps.plan.outputs.kz }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/plan_lean_candidates.py

  components:
    name: Candidate ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.components != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.components) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Build, audit axioms, and replay project dependencies
        run: python3 scripts/verify_lean_candidate.py '${{ matrix.task }}'

  four-speed:
    name: Four-speed prime ${{ matrix.prime }}
    needs: plan
    if: needs.plan.outputs.four == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prime: [17, 29, 31, 37, 41, 43, 47, 53, 59, 61]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Verify residue coverage and exhaustive lifting trees
        run: python3 scripts/verify_lean_candidate.py 'four-${{ matrix.prime }}' --export
      - uses: actions/upload-artifact@v4
        with:
          name: checked-four-${{ matrix.prime }}
          path: .candidate-artifacts/four-${{ matrix.prime }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  four-assembly:
    name: Four-speed bounded classification
    needs: [plan, four-speed]
    if: needs.plan.outputs.four == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - uses: actions/download-artifact@v4
        with:
          pattern: checked-four-*
          path: lean/.lake/build
          merge-multiple: true
      - name: Validate checked artifacts and verify classification assembly
        run: python3 scripts/verify_lean_candidate.py four-assembly --reuse four

  kz:
    name: KZ product for ${{ matrix.dimension }} speeds
    needs: plan
    if: needs.plan.outputs.kz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dimension: [9, 10, 11, 12, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Verify every subset certificate
        run: python3 scripts/verify_lean_candidate.py 'kz-${{ matrix.dimension }}' --export
      - uses: actions/upload-artifact@v4
        with:
          name: checked-kz-${{ matrix.dimension }}
          path: .candidate-artifacts/kz-${{ matrix.dimension }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  kz-assembly:
    name: KZ product minimization
    needs: [plan, kz]
    if: needs.plan.outputs.kz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - uses: actions/download-artifact@v4
        with:
          pattern: checked-kz-*
          path: lean/.lake/build
          merge-multiple: true
      - name: Validate checked artifacts and verify product minimizer
        run: python3 scripts/verify_lean_candidate.py kz-assembly --reuse kz
