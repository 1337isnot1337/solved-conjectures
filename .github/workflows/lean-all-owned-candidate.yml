name: Lean all-owned audit candidate

on:
  workflow_dispatch:
    inputs:
      accepted:
        description: "Run the complete accepted closure; otherwise run only the mixed-module fixture"
        type: boolean
        default: false
      workers:
        description: "Stock checker worker count"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
  push:
    branches: [main]
    paths:
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/test_lean_all_owned.py'
      - 'scripts/verify_lean_all_owned_candidate.py'
      - 'docs/lean-all-owned-candidate-sources.json'
      - '.github/workflows/lean-all-owned-candidate.yml'

permissions:
  contents: read

concurrency:
  group: lean-all-owned-candidate-${{ github.event.inputs.accepted || 'false' }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all-owned audit protocol before Lean setup
        run: |
          python3 -m py_compile scripts/audit_lean_all_owned.py scripts/test_lean_all_owned.py scripts/verify_lean_all_owned_candidate.py
          python3 scripts/test_lean_all_owned.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
      - name: Fresh source, complete private declaration audit, exact stock replay
        env:
          CHECK_ACCEPTED: ${{ github.event.inputs.accepted || 'false' }}
          CHECK_WORKERS: ${{ github.event.inputs.workers || '1' }}
        run: |
          args=()
          case "$CHECK_ACCEPTED" in
            true) args+=(--accepted) ;;
            false) ;;
            *) exit 2 ;;
          esac
          python3 scripts/verify_lean_all_owned_candidate.py \
            --output-dir .candidate-artifacts/lean-all-owned-candidate \
            --jobs 2 --workers "$CHECK_WORKERS" --memory-limit-mib 12288 \
            "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-all-owned-candidate
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .candidate-artifacts/lean-all-owned-candidate/receipt.json
            .candidate-artifacts/lean-all-owned-candidate/*.log
            .candidate-artifacts/lean-all-owned-candidate/declaration-inventory.json
            .candidate-artifacts/lean-all-owned-candidate/source/receipt.json
            .candidate-artifacts/lean-all-owned-candidate/source/*.log
            .candidate-artifacts/lean-all-owned-candidate/replay-*/receipt.json
            .candidate-artifacts/lean-all-owned-candidate/replay-*/kernel.log
            .candidate-artifacts/lean-all-owned-candidate/repo/lean/AllOwnedProofAudit.lean
            .candidate-artifacts/lean-all-owned-candidate/repo/lean/AllOwnedNegativeAudit.lean
