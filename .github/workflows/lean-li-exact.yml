name: Lean Li counterexample exact source and kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-li-exact.yml'
      - 'scripts/verify_li_exact.py'
      - 'docs/li-exact-sources.json'
      - 'lean/Conjectures/LiBasic.lean'
      - 'lean/Conjectures/LiBridge.lean'
      - 'lean/Conjectures/LiChromatic.lean'
      - 'lean/Conjectures/LiCompute.lean'
      - 'lean/Conjectures/LiDualFull.lean'
      - 'lean/Conjectures/LiDualTrunc.lean'
      - 'lean/Conjectures/LiEliminate.lean'
      - 'lean/Conjectures/LiEmapFinal.lean'
      - 'lean/Conjectures/LiFullCoeff.lean'
      - 'lean/Conjectures/LiFullCoeffTrunc.lean'
      - 'lean/Conjectures/LiMain.lean'
      - 'lean/Conjectures/LiMonomial.lean'
      - 'lean/Conjectures/LiPartitionsCount.lean'
      - 'lean/Conjectures/LiPartitionsFinal.lean'
      - 'lean/Conjectures/LiPartitionsFinalCore.lean'
      - 'lean/Conjectures/LiPartitionsFinalData00.lean'
      - 'lean/Conjectures/LiPartitionsFinalData01.lean'
      - 'lean/Conjectures/LiPartitionsFinalData02.lean'
      - 'lean/Conjectures/LiPartitionsFinalData03.lean'
      - 'lean/Conjectures/LiPartitionsFinalData04.lean'
      - 'lean/Conjectures/LiPartitionsFinalData05.lean'
      - 'lean/Conjectures/LiPartitionsFinalData06.lean'
      - 'lean/Conjectures/LiPartitionsFinalData07.lean'
      - 'lean/Conjectures/LiPartitionsFinalData08.lean'
      - 'lean/Conjectures/LiPartitionsFinalData09.lean'
      - 'lean/Conjectures/LiPartitionsFinalData10.lean'
      - 'lean/Conjectures/LiPartitionsFinalData11.lean'
      - 'lean/Conjectures/LiPartitionsFinalData12.lean'
      - 'lean/Conjectures/LiPartitionsFinalData13.lean'
      - 'lean/Conjectures/LiPartitionsFinalEnum.lean'
      - 'lean/Conjectures/LiPartitionsGraph.lean'
      - 'lean/Conjectures/LiSpecFinal.lean'
      - 'lean/Conjectures/LiTriples2.lean'
      - 'lean/Conjectures/LiTriplesBridge.lean'
      - 'lean/Conjectures/LiTriplesFinal.lean'
      - 'lean/Conjectures/LiTrunc.lean'
      - 'lean/Conjectures/LiWeighted.lean'
      - 'lean/Conjectures/LiWeighted2.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'

permissions:
  contents: read

concurrency:
  group: lean-li-exact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact proof and helper inventory
        run: |
          python3 -m py_compile scripts/verify_li_exact.py
          python3 scripts/verify_li_exact.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict sources, all-owned audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_li_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: li-exact
          path: .candidate-artifacts/li-exact/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
