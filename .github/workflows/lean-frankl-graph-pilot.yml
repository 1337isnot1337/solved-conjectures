name: Lean Frankl initial graph pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'lean/Conjectures/FranklSpanFourGraph*.lean'
      - 'docs/frankl-graph-pilot-sources.json'
      - 'docs/frankl-graph-helpers-sources.json'
      - 'scripts/verify_frankl_graph_pilot.py'
      - 'scripts/verify_frankl_graph_helpers.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'results/frankl-generator-families/generate_span_four_graph_certificate.py'
      - 'results/frankl-generator-families/span_four.py'
      - 'results/frankl-generator-families/window_filter.cpp'
      - 'results/frankl-generator-families/window_replay.cpp'
      - 'results/frankl-generator-families/width_four_weight_candidates.json'
      - '.github/workflows/lean-frankl-graph-pilot.yml'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
  pull_request:
    paths:
      - 'lean/Conjectures/FranklSpanFourGraph*.lean'
      - 'docs/frankl-graph-pilot-sources.json'
      - 'scripts/verify_frankl_graph_pilot.py'
      - '.github/workflows/lean-frankl-graph-pilot.yml'

permissions:
  contents: read

jobs:
  prefix-edge-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install public witness-producer dependencies
        run: python3 -m pip install numpy scipy
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Reproduce sources, strict source gate, all-declaration audit and exact replay
        run: python3 scripts/verify_frankl_graph_pilot.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-initial-graph-pilot
          path: .candidate-artifacts/frankl-graph-pilot*/
          if-no-files-found: warn
          retention-days: 14
