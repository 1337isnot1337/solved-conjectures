permissions:
  contents: read

jobs:
  prefix-edge-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install public witness-producer dependencies
        run: python3 -m pip install numpy scipy
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Reproduce sources, strict source gate, all-declaration audit and exact replay
        run: python3 scripts/verify_frankl_graph_pilot.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-initial-graph-pilot
          path: |
            .candidate-artifacts/frankl-graph-pilot/
            .candidate-artifacts/frankl-graph-pilot-reproduction/
          if-no-files-found: error
          retention-days: 14
