name: Lean bounded cut counter benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lean-modular-cut-counter-benchmark.yml'
      - 'docs/modular-cut-counter-benchmark-sources.json'
      - 'lean/Conjectures/LonelinessModularCoverBits.lean'
      - 'lean/Conjectures/LonelinessModularCoverByteCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverByteCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverChunks.lean'
      - 'lean/Conjectures/LonelinessModularCoverCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverSearch.lean'
      - 'lean/Conjectures/LonelinessModularCoverTape.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/generate_modular_initial_support.py'
      - 'scripts/generate_modular_support_cut_fragments.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_modular_cut_counter_benchmark.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LEAN_NUM_THREADS: '1'

jobs:
  paired_benchmark:
    name: p251 b4 cut391 FastCuts and ByteCuts
    runs-on: ubuntu-latest
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen bounded scope
        run: python3 scripts/verify_modular_cut_counter_benchmark.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Fresh paired source, private audit and exact stock replay
        timeout-minutes: 145
        run: python3 scripts/verify_modular_cut_counter_benchmark.py --stage .candidate-artifacts/modular-cut-counter-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-cut-counter-benchmark-${{ github.sha }}
          path: .candidate-artifacts/modular-cut-counter-benchmark/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
