name: Lean prime-257 split support certificate candidates

on:
  workflow_dispatch:
    inputs:
      task:
        description: Exact closure to check
        required: true
        default: main
        type: choice
        options:
          - main
          - facts
          - checks00
          - checks01
          - checks02
          - checks03
          - checks04
          - checks05
          - checks06
          - checks07
          - checks08
          - checks09
  push:
    paths:
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/generate_six_support_257_cuts.mjs'
      - 'scripts/verify_loneliness_support257_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-loneliness-support257-candidates.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/generate_six_support_257_cuts.mjs'
      - 'scripts/verify_loneliness_support257_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-loneliness-support257-candidates.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    name: Select the prime-257 exact closure
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          REQUESTED_TASK: ${{ inputs.task || 'main' }}
        run: python3 scripts/verify_loneliness_support257_candidate.py --plan-ci --requested-task "$REQUESTED_TASK"

  candidates:
    name: Prime-257 split certificate ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check every project source, audit axioms, and replay the exact closure
        run: python3 scripts/verify_loneliness_support257_candidate.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loneliness-support257-${{ matrix.task }}-receipt
          path: .candidate-artifacts/loneliness-support257-${{ matrix.task }}/receipt.json
          if-no-files-found: warn
          retention-days: 7
