name: Lean modular cover byte counts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-modular-cover-byte-counts.yml'
      - 'docs/modular-cover-byte-counts-sources.json'
      - 'lean/Conjectures/LonelinessModularCoverBits.lean'
      - 'lean/Conjectures/LonelinessModularCoverByteCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverByteCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverChunks.lean'
      - 'lean/Conjectures/LonelinessModularCoverCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverSearch.lean'
      - 'lean/Conjectures/LonelinessModularCoverTape.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_modular_cover_byte_counts.py'
      - 'scripts/verify_renault_foundations.py'

permissions:
  contents: read

concurrency:
  group: lean-modular-cover-byte-counts
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Validate the frozen source model
        run: |
          python3 -m py_compile scripts/verify_modular_cover_byte_counts.py
          python3 scripts/verify_modular_cover_byte_counts.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, all-owned private audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_modular_cover_byte_counts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-cover-byte-counts-${{ github.sha }}
          path: .candidate-artifacts/modular-cover-byte-counts/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
