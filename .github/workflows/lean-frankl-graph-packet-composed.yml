name: Lean Frankl graph packet adapter

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify_frankl_graph_packet_composed.py'
      - '.github/workflows/lean-frankl-graph-packet-composed.yml'
      - 'lean/Conjectures/FranklSpanFourGraphPacket.lean'

permissions:
  contents: read
  actions: read

concurrency:
  group: frankl-graph-packet-composed-${{ github.sha }}
  cancel-in-progress: false

env:
  LEAN_NUM_THREADS: '1'
  UV_USE_IO_URING: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exact frozen packet closure and archive protocol
        run: |
          python3 -m py_compile scripts/verify_frankl_graph_packet_composed.py
          python3 scripts/test_frankl_span_four_final.py
          python3 scripts/verify_frankl_graph_packet_composed.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Check the six graph packet theorems against verified object bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_frankl_graph_packet_composed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-graph-packet-composed
          path: .candidate-artifacts/frankl-graph-packet-composed/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
