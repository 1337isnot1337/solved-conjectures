name: Lean bounded scheduler candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_lean_parallel.py'
      - 'scripts/replay_lean_parallel.py'
      - 'scripts/test_lean_parallel.py'
      - 'scripts/verify_lean_parallel_candidate.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/replay_lean.py'
      - 'docs/lean-parallel-candidate-sources.json'
      - '.github/workflows/lean-parallel-candidate.yml'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/Conjectures/FranklSmallCyclicWeights*Pilot*.lean'
  pull_request:
    paths:
      - 'scripts/build_lean_parallel.py'
      - 'scripts/replay_lean_parallel.py'
      - 'scripts/test_lean_parallel.py'
      - 'scripts/verify_lean_parallel_candidate.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/replay_lean.py'
      - 'docs/lean-parallel-candidate-sources.json'
      - '.github/workflows/lean-parallel-candidate.yml'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/Conjectures/FranklSmallCyclicWeights*Pilot*.lean'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run all 22 protocol and process tests before Lean setup
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .candidate-artifacts
          python3 scripts/test_lean_parallel.py 2>&1 | tee .candidate-artifacts/lean-parallel-protocol.log
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Fresh isolated source, all-declaration audit, exact stock worker measurements
        run: python3 scripts/verify_lean_parallel_candidate.py --output-dir .candidate-artifacts/lean-parallel-candidate --jobs 2 --workers 1 2 3 4 --memory-limit-mib 12288
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-bounded-scheduler-candidate
          path: |
            .candidate-artifacts/lean-parallel-protocol.log
            .candidate-artifacts/lean-parallel-candidate/**/*.json
            .candidate-artifacts/lean-parallel-candidate/**/*.log
            .candidate-artifacts/lean-parallel-candidate/**/lean/ProofAudit*.lean
          if-no-files-found: warn
          retention-days: 14
