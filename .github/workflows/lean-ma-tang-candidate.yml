name: Ma–Tang’s random subset-sum threshold conjecture
on:
  pull_request:
    paths:
      - 'lean/Conjectures/MaTangRandomSubsetSums*.lean'
      - '.github/workflows/lean-ma-tang-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Strict source compilation
        working-directory: lean
        run: |
          lake build Conjectures.MaTangRandomSubsetSumsOccupancy
          lake env lean -DwarningAsError=true -Dlinter.all=false Conjectures/MaTangRandomSubsetSumsCore.lean
          lake env lean -DwarningAsError=true -Dlinter.all=false Conjectures/MaTangRandomSubsetSumsKernel.lean
          lake env lean -DwarningAsError=true -Dlinter.all=false Conjectures/MaTangRandomSubsetSumsOccupancy.lean
      - name: Audit all owned declarations and required endpoints
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from verify_lean_candidate import audit
          core = "Conjectures.MaTangRandomSubsetSumsCore"
          kernel = "Conjectures.MaTangRandomSubsetSumsKernel"
          occupancy = "Conjectures.MaTangRandomSubsetSumsOccupancy"
          required = ["MaTangRandomSubsetSums.exists_balanced_signs",
                      "MaTangRandomSubsetSums.exists_constant_fiber",
                      "MaTangRandomSubsetSums.not_surjective_of_kernel_columns",
                      "MaTangRandomSubsetSums.kernel_basis_represents_fiber",
                      "MaTangRandomSubsetSums.not_surjective_of_kernel_basis",
                      "MaTangRandomSubsetSums.uniqueHit_card",
                      "MaTangRandomSubsetSums.singleton_union_card_le",
                      "MaTangRandomSubsetSums.singleton_occupancy_card_le"]
          audit([occupancy], required, [core, kernel, occupancy], "ma-tang-occupancy")
          PY
      - name: Stock kernel replay of exact local import closure
        working-directory: lean
        run: lake env python3 ../scripts/replay_lean.py --root Conjectures.MaTangRandomSubsetSumsOccupancy
