name: Juhnke’s arbitrary-step lattice-path log-concavity conjecture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lean/Conjectures/Juhnke*.lean'
      - 'scripts/verify_lean_target.py'
      - '.github/workflows/lean-juhnke.yml'
  push:
    branches: [research, main]
    paths:
      - 'lean/Conjectures/Juhnke*.lean'
      - 'scripts/verify_lean_target.py'
      - '.github/workflows/lean-juhnke.yml'
      - 'lean/lean-toolchain'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Strict source, all-owned audit, and stock-kernel replay
        run: >-
          python3 scripts/verify_lean_target.py
          --root Conjectures.JuhnkePathsTheorem
          --require Juhnke.juhnke_conjecture
          --require Juhnke.originalPathCount_logConcave
          --require Juhnke.originalPathCount_unimodal
          --require Juhnke.literalPathStepsEquiv
          --require Juhnke.literalPathCutsEquiv
          --require Juhnke.unitWordMaximalEquiv
          --require Juhnke.unitWordAlternatingLengthsEquiv
          --require Juhnke.pathPolynomial_sum_runCounts
          --require Juhnke.originalPathPolynomial_translated
          --require Juhnke.originalEndpoint_total
          --require Juhnke.combined_pathPolynomial
          --out .candidate-artifacts/juhnke
      - uses: actions/upload-artifact@v4
        with:
          name: juhnke
          path: .candidate-artifacts/juhnke/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
