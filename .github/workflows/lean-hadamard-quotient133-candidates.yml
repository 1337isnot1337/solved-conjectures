name: Lean quotient-133 certificate candidates

on:
  workflow_dispatch:
    inputs:
      task:
        description: Exact component closure to check
        required: true
        default: affected
        type: choice
        options:
          - affected
          - catalog
          - model
          - packet
          - sample
          - orbits
          - catalog_verified
          - rows_verified
          - margins_verified
          - main
  push:
    paths:
      - 'lean/Conjectures/HadamardQuotient133*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_hadamard_quotient133_candidate.py'
      - 'scripts/verify_hadamard_quotient133_staged.py'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/test_hadamard_quotient133_staged.py'
      - 'scripts/generate_hadamard_quotient133.mjs'
      - 'results/hadamard-2396/PROOF.md'
      - 'results/hadamard-2396/quotient133.cpp'
      - 'results/hadamard-2396/quotient133.pairs'
      - 'results/hadamard-2396/audit.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-hadamard-quotient133-candidates.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/HadamardQuotient133*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_hadamard_quotient133_candidate.py'
      - 'scripts/verify_hadamard_quotient133_staged.py'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/test_hadamard_quotient133_staged.py'
      - 'scripts/generate_hadamard_quotient133.mjs'
      - 'results/hadamard-2396/PROOF.md'
      - 'results/hadamard-2396/quotient133.cpp'
      - 'results/hadamard-2396/quotient133.pairs'
      - 'results/hadamard-2396/audit.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-hadamard-quotient133-candidates.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    name: Select affected quotient-133 proofs
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      direct_tasks: ${{ steps.plan.outputs.direct_tasks }}
      main: ${{ steps.plan.outputs.main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check source-stage provenance controls
        run: python3 -m unittest discover -s scripts -p 'test_hadamard_quotient133_staged.py'
      - id: plan
        env:
          REQUESTED_TASK: ${{ inputs.task || 'affected' }}
        run: python3 scripts/verify_hadamard_quotient133_candidate.py --plan-ci --requested-task "$REQUESTED_TASK"

  candidates:
    name: quotient-133 candidate ${{ matrix.task }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.task }}
      cancel-in-progress: false
    needs: plan
    if: needs.plan.outputs.direct_tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.direct_tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check sources, audit, and replay the exact project closure
        run: python3 scripts/verify_hadamard_quotient133_candidate.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadamard-quotient133-${{ matrix.task }}-receipt
          path: .candidate-artifacts/hadamard-quotient133-${{ matrix.task }}/receipt.json
          if-no-files-found: warn
          retention-days: 7

  source_stages:
    name: quotient-133 strict source ${{ matrix.stage }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-source-${{ matrix.stage }}
      cancel-in-progress: false
    needs: plan
    if: needs.plan.outputs.main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        stage: [catalog_verified, rows_verified, margins_source0, margins_source1, margins_source2]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Strictly compile the exact source-stage closure
        run: python3 scripts/verify_hadamard_quotient133_staged.py source '${{ matrix.stage }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadamard-quotient133-source-${{ matrix.stage }}
          path: .candidate-artifacts/hadamard-quotient133-staged/${{ matrix.stage }}/
          if-no-files-found: error
          retention-days: 7

  full_verification:
    name: quotient-133 full Main audit and kernel replay
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-main
      cancel-in-progress: false
    needs: [plan, source_stages]
    if: needs.plan.outputs.main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - uses: actions/download-artifact@v4
        with:
          pattern: hadamard-quotient133-source-*
          path: .candidate-inputs/quotient133
      - name: Validate every source and object, audit all owned declarations, and replay all modules
        run: python3 scripts/verify_hadamard_quotient133_staged.py assemble .candidate-inputs/quotient133
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadamard-quotient133-main-receipt
          path: .candidate-artifacts/hadamard-quotient133-main/
          if-no-files-found: error
          retention-days: 7

