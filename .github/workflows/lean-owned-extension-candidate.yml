name: Lean scoped owned-extension audit candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_lean_owned_extension.py'
      - 'scripts/test_lean_owned_extension.py'
      - 'scripts/verify_lean_owned_extension_candidate.py'
      - '.github/workflows/lean-owned-extension-candidate.yml'

permissions:
  contents: read

concurrency:
  group: lean-owned-extension-candidate
  cancel-in-progress: false

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the scoped-audit protocol before Lean setup
        run: |
          python3 -m py_compile scripts/audit_lean_owned_extension.py scripts/verify_lean_owned_extension_candidate.py
          python3 scripts/test_lean_owned_extension.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh scoped audit fixture and exact stock replay
        run: python3 scripts/verify_lean_owned_extension_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-owned-extension-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .candidate-artifacts/lean-owned-extension/receipt.json
            .candidate-artifacts/lean-owned-extension/*.json
            .candidate-artifacts/lean-owned-extension/*.log
            .candidate-artifacts/lean-owned-extension/source/
            .candidate-artifacts/lean-owned-extension/replay-1/
            .candidate-artifacts/lean-owned-extension/repo/scripts/
            .candidate-artifacts/lean-owned-extension/repo/lean/Conjectures/
            .candidate-artifacts/lean-owned-extension/repo/lean/OwnedExtensionAudit.lean
            .candidate-artifacts/lean-owned-extension/repo/lean/UnownedChoiceAudit.lean
            .candidate-artifacts/lean-owned-extension/repo/lean/OwnedPrivateNegativeAudit.lean
            .candidate-artifacts/lean-owned-extension/repo/lean/lean-toolchain
            .candidate-artifacts/lean-owned-extension/repo/lean/lakefile.toml
            .candidate-artifacts/lean-owned-extension/repo/lean/lake-manifest.json
