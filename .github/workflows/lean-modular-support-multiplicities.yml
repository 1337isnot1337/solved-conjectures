name: Lean modular support multiplicities

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-modular-support-multiplicities.yml'
      - 'docs/modular-support-multiplicities-sources.json'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessCoalescence.lean'
      - 'lean/Conjectures/LonelinessCoalescenceValue.lean'
      - 'lean/Conjectures/LonelinessContinuity.lean'
      - 'lean/Conjectures/LonelinessCoordinateClasses.lean'
      - 'lean/Conjectures/LonelinessCoordinateSubspace.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessCriticalFamilies.lean'
      - 'lean/Conjectures/LonelinessCriticalSecond.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessFourSpeedCertificate.lean'
      - 'lean/Conjectures/LonelinessFourSpeedEnumeration.lean'
      - 'lean/Conjectures/LonelinessIntegerDirection.lean'
      - 'lean/Conjectures/LonelinessModularClosedFoldedSearch.lean'
      - 'lean/Conjectures/LonelinessModularCoverBits.lean'
      - 'lean/Conjectures/LonelinessModularCoverChunks.lean'
      - 'lean/Conjectures/LonelinessModularCoverCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverSearch.lean'
      - 'lean/Conjectures/LonelinessModularCoverTape.lean'
      - 'lean/Conjectures/LonelinessModularDirections.lean'
      - 'lean/Conjectures/LonelinessModularFoldedSearch.lean'
      - 'lean/Conjectures/LonelinessModularInitialBits.lean'
      - 'lean/Conjectures/LonelinessModularInitialMemo.lean'
      - 'lean/Conjectures/LonelinessModularInitialSupport.lean'
      - 'lean/Conjectures/LonelinessModularLift.lean'
      - 'lean/Conjectures/LonelinessModularMemo.lean'
      - 'lean/Conjectures/LonelinessModularMultiplicity.lean'
      - 'lean/Conjectures/LonelinessModularNormalize.lean'
      - 'lean/Conjectures/LonelinessModularParity.lean'
      - 'lean/Conjectures/LonelinessModularRationalWitness.lean'
      - 'lean/Conjectures/LonelinessModularSearch.lean'
      - 'lean/Conjectures/LonelinessModularShortVector.lean'
      - 'lean/Conjectures/LonelinessModularStrictWitness.lean'
      - 'lean/Conjectures/LonelinessModularSupportFiniteSound.lean'
      - 'lean/Conjectures/LonelinessModularSupportLists.lean'
      - 'lean/Conjectures/LonelinessModularSupportMultiplicity.lean'
      - 'lean/Conjectures/LonelinessModularWitness.lean'
      - 'lean/Conjectures/LonelinessNormalization.lean'
      - 'lean/Conjectures/LonelinessRational.lean'
      - 'lean/Conjectures/LonelinessRationalSubspace.lean'
      - 'lean/Conjectures/LonelinessSubspaceDensity.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/generate_modular_initial_support.py'
      - 'scripts/generate_modular_support_multiplicities.py'
      - 'scripts/generate_six_speed_prime_arithmetic.py'
      - 'scripts/generate_six_speed_prime_assembly.py'
      - 'scripts/generate_six_speed_prime_certificates.py'
      - 'scripts/generate_six_speed_prime_fast.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_modular_support_multiplicities.py'
      - 'scripts/verify_six_speed_prime_batches.py'
      - 'scripts/verify_six_speed_prime_pipeline.py'

permissions:
  contents: read

concurrency:
  group: lean-modular-support-multiplicities
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact source and numerical models
        run: |
          python3 -m py_compile scripts/verify_modular_support_multiplicities.py scripts/generate_modular_support_multiplicities.py
          python3 scripts/generate_modular_support_multiplicities.py --self-test
          python3 scripts/verify_modular_support_multiplicities.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh source, all-owned audit and exact stock prefix replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_modular_support_multiplicities.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-support-multiplicities-${{ github.sha }}
          path: .candidate-artifacts/modular-support-multiplicities/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
