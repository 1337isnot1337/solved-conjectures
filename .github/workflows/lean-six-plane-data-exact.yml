name: Lean six-plane finite certificates

on:
  workflow_dispatch:
    inputs:
      task:
        description: Full finite proof, or one component
        type: choice
        default: groups
        options: [groups, coverage, pattern-0, pattern-1, pattern-2, pattern-3, pattern-4, pattern-5, pattern-6, pattern-7, pattern-8, pattern-9]
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-six-plane-data-exact.yml'
      - 'scripts/verify_six_plane_data_exact.py'
      - 'scripts/authenticate_six_plane_groups.py'
      - 'scripts/generate_six_plane_source_model.py'
      - 'docs/six-plane-data-exact-sources.json'
      - 'lean/Conjectures/LonelinessSixPlaneData*.lean'
      - 'lean/Conjectures/LonelinessSixPlaneDefs.lean'
      - 'lean/Conjectures/LonelinessSixPlaneEnumeration.lean'
      - 'lean/Conjectures/LonelinessSixPlaneChunkSoundness.lean'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

concurrency:
  group: lean-six-plane-data-exact-${{ github.ref }}-${{ github.event.inputs.task || 'groups' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
      assemble: ${{ steps.tasks.outputs.assemble }}
    steps:
      - id: tasks
        env:
          REQUESTED_TASK: ${{ github.event.inputs.task || 'groups' }}
        run: |
          python3 - <<'PY'
          import json, os
          groups = ['coverage'] + [f'pattern-{i}' for i in range(10)]
          requested = os.environ['REQUESTED_TASK']
          assert requested in ['groups', *groups]
          tasks = groups if requested == 'groups' else [requested]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('tasks=' + json.dumps(tasks) + '\n')
              stream.write('assemble=' + ('true' if requested == 'groups' else 'false') + '\n')
          PY
  verify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source and helper inventory
        run: |
          python3 -m py_compile scripts/verify_six_plane_data_exact.py
          python3 scripts/verify_six_plane_data_exact.py '${{ matrix.task }}' --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict sources, complete ownership audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_six_plane_data_exact.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-plane-data-${{ matrix.task }}
          path: .candidate-artifacts/six-plane-data-${{ matrix.task }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
  assembly:
    needs: [plan, verify]
    if: needs.plan.outputs.assemble == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate complete finite theorem source inventory
        run: |
          python3 -m py_compile scripts/verify_six_plane_data_exact.py
          python3 scripts/verify_six_plane_data_exact.py assembly --plan
      - name: Download exact component evidence from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: six-plane-data-*
          path: .candidate-group-evidence
          merge-multiple: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Authenticate complete closure and check the new assembly
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_six_plane_data_exact.py assembly --group-evidence .candidate-group-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-plane-data-assembly
          path: .candidate-artifacts/six-plane-data-assembly/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
