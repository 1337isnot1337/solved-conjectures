name: Research site

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTENTS.md'
      - 'HISTORY.md'
      - 'results/**'
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'scripts/test_build_site.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'CONTENTS.md'
      - 'HISTORY.md'
      - 'results/**'
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'scripts/test_build_site.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the document renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc
      - name: Test mathematical scope and Lean-status validation
        run: python3 scripts/test_build_site.py
      - name: Build the complete research site
        run: python3 scripts/build_site.py
      - name: Check content, links, mathematics, and metadata
        run: python3 scripts/check_site.py _site
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

# The maintainer's existing 1337isnot1337.github.io Pages workflow builds
# this source into its /solved-conjectures/ subdirectory and publishes it.
# This workflow checks every source change without requiring Pages admin
# permissions or a cross-repository write credential.
