permissions:
  contents: read
  actions: read

concurrency:
  group: lean-tight-seven-closed-lift-join-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Check the exact repaired source and original provider model
        run: |
          python3 -m py_compile scripts/verify_tight_seven_closed_lift_join.py scripts/test_tight_seven_closed_lift_join.py scripts/audit_lean_raw_occurrences.py
          python3 scripts/verify_tight_seven_closed_lift_join.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Authenticate original proofs and verify the repaired aggregate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_tight_seven_closed_lift_join.py --verify
      - name: Preserve original and new verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tight-seven-closed-lift-join-${{ github.sha }}
          path: .candidate-artifacts/tight-seven-closed-lift-join/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
