name: Recover and verify Frankl weight batches

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/frankl-weight-recovery.yml'
      - 'scripts/recover_frankl_weight_batches.py'
      - 'scripts/templates/lean-frankl-orbit-batches.yml'

permissions:
  contents: read

jobs:
  recover:
    name: Reproduce frozen sources and verify first512 rows
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
      groups: ${{ steps.publish.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact short-period sources and independent period-ten candidates
        run: python3 scripts/recover_frankl_weight_batches.py prepare
      - name: Check complete partition and group selection
        run: python3 -m unittest discover -s scripts -p test_frankl_orbit_batches.py -v
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Fresh exact source, axiom and stock-kernel gate for g00
        run: python3 scripts/verify_frankl_orbit_batches.py g00 --jobs 4
      - id: publish
        name: Preserve checked sources and candidates with a fast-forward-only commit
        run: python3 scripts/recover_frankl_weight_batches.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-weight-recovery-and-g00
          path: |
            .candidate-artifacts/frankl-weight-recovery/
            .candidate-artifacts/frankl-orbit-g00/
          if-no-files-found: warn
          retention-days: 14

  remaining:
    name: Recovered orbit arithmetic ${{ matrix.group }}
    needs: recover
    if: needs.recover.outputs.published_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.recover.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.recover.outputs.published_sha }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Rebuild isolated sources, audit all declarations, replay exact closure
        run: python3 scripts/verify_frankl_orbit_batches.py '${{ matrix.group }}' --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-recovered-orbit-${{ matrix.group }}-receipt
          path: .candidate-artifacts/frankl-orbit-${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 14
