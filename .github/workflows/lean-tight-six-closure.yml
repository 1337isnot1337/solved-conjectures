permissions:
  contents: read

concurrency:
  group: tight-six-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conditional-closure:
    name: Fresh conditional six-speed closure
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '1'
      UV_USE_IO_URING: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          check-lean-environment: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Validate the exact component closure and frozen controller imports
        run: python3 scripts/verify_tight_six_closure.py --plan
      - name: Compile conditional sources, audit every owned declaration, replay the exact closure
        working-directory: lean
        run: lake env python3 ../scripts/verify_tight_six_closure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tight-six-closure-${{ github.sha }}
          path: .candidate-artifacts/tight-six-closure/
          include-hidden-files: 'true'
          if-no-files-found: error
          retention-days: 14
