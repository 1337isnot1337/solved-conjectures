permissions:
  contents: read

concurrency:
  group: lean-critical-seven-exact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact source and helper inventory
        run: |
          python3 -m py_compile scripts/verify_critical_seven_exact.py
          python3 scripts/verify_critical_seven_exact.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, all-owned private audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_critical_seven_exact.py
      - name: Show reached Lean source or audit errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path(".candidate-artifacts/critical-seven-exact/logs").glob("*.log")):
              value = path.read_text()
              if "error:" in value or "warning:" in value:
                  print(str(path))
                  print(value[-24000:])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-seven-exact
          path: .candidate-artifacts/critical-seven-exact/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
