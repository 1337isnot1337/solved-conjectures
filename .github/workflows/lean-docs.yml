name: Lean documentation
on:
  push:
    branches: [main, research]
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.mdx'
      - '**/*.lean'
      - 'scripts/check_lean_docs.py'
      - 'scripts/test_check_lean_docs.py'
      - '.github/workflows/lean-docs.yml'
  pull_request:
    branches: [main, research]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install markdown-it-py==4.2.0
      - run: python scripts/test_check_lean_docs.py
      - run: python scripts/check_lean_docs.py
