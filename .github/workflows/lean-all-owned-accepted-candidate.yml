name: Lean full accepted all-owned candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_lean_all_owned_accepted.py'
      - 'docs/lean-all-owned-accepted-snapshot.json'
      - '.github/workflows/lean-all-owned-accepted-candidate.yml'

permissions:
  contents: read

concurrency:
  group: lean-full-accepted-all-owned-candidate
  cancel-in-progress: false

jobs:
  full-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the frozen accepted inventory before Lean setup
        run: |
          python3 -m py_compile scripts/verify_lean_all_owned_accepted.py
          python3 scripts/test_lean_all_owned.py
          python3 scripts/verify_lean_all_owned_accepted.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh full source build, all-owned private audit, exact stock replay
        run: python3 scripts/verify_lean_all_owned_accepted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-full-accepted-all-owned-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
          path: |
            .candidate-artifacts/lean-all-owned-accepted/full-snapshot-receipt.json
            .candidate-artifacts/lean-all-owned-accepted/receipt.json
            .candidate-artifacts/lean-all-owned-accepted/*.log
            .candidate-artifacts/lean-all-owned-accepted/declaration-inventory.json
            .candidate-artifacts/lean-all-owned-accepted/source/receipt.json
            .candidate-artifacts/lean-all-owned-accepted/source/*.log
            .candidate-artifacts/lean-all-owned-accepted/replay-1/receipt.json
            .candidate-artifacts/lean-all-owned-accepted/replay-1/kernel.log
            .candidate-artifacts/lean-all-owned-accepted/replay-1/lib/lean/
            .candidate-artifacts/lean-all-owned-accepted/repo/scripts/
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/Conjectures/
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/Solitaire/
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/Conjectures.lean
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/Solitaire.lean
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/ProofAudit.lean
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/AllOwnedProofAudit.lean
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/lean-toolchain
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/lakefile.toml
            .candidate-artifacts/lean-all-owned-accepted/repo/lean/lake-manifest.json
