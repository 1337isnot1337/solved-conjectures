name: Lean hyperplane theorem candidates

on:
  workflow_dispatch:
    inputs:
      task:
        description: Exact component closure to check
        required: true
        default: affected
        type: choice
        options:
          - affected
          - probability
          - haar-law
          - shift-laws
          - endpoint-density
          - rate-sharpness
          - denominator
          - system-counts
          - exceptional-count
          - fixed-shift
          - main

  push:
    paths:
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_loneliness_hyperplane_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-loneliness-hyperplane-candidates.yml'

  pull_request:
    paths:
      - 'lean/Conjectures/Loneliness*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_loneliness_hyperplane_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-loneliness-hyperplane-candidates.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    name: Select affected Hyperplane proofs
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          REQUESTED_TASK: ${{ inputs.task || 'affected' }}
        run: python3 scripts/verify_loneliness_hyperplane_candidate.py --plan-ci --requested-task "$REQUESTED_TASK"

  candidates:
    name: Hyperplane candidate ${{ matrix.task }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.task }}
      cancel-in-progress: false
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check sources, audit, and replay the exact project closure
        run: python3 scripts/verify_loneliness_hyperplane_candidate.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loneliness-hyperplane-${{ matrix.task }}-receipt
          path: .candidate-artifacts/loneliness-hyperplane-${{ matrix.task }}/receipt.json
          if-no-files-found: warn
          retention-days: 7
