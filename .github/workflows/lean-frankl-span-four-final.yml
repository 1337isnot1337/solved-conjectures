name: Lean Frankl final span-four theorem

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-frankl-span-four-final.yml'
      - 'scripts/verify_frankl_span_four_final.py'
      - 'scripts/test_frankl_span_four_final.py'
      - 'scripts/audit_lean_owned_extension.py'
      - 'docs/frankl-span-four-composed-model.json'
      - 'lean/Conjectures/FranklSpanFourGraphPacket.lean'
      - 'lean/Conjectures/FranklSpanFourTheorem.lean'

permissions:
  contents: read
  actions: read

concurrency:
  group: frankl-final-span-four
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: identity
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check composition protocol and exact theorem closure
        run: |
          python3 -m py_compile scripts/verify_frankl_span_four_final.py scripts/test_frankl_span_four_final.py
          python3 -m unittest discover -s scripts -p test_frankl_span_four_final.py -v
          python3 scripts/verify_frankl_span_four_final.py --plan --plan-output .candidate-artifacts/frankl-span-four-final-plan.json
      - id: ready
        name: Require immutable passed evidence for every dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_frankl_span_four_final.py --readiness
      - uses: actions/upload-artifact@v4
        with:
          name: frankl-span-four-final-plan
          path: .candidate-artifacts/frankl-span-four-final-plan.json
          include-hidden-files: true
          retention-days: 14
  verify:
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Validate original proof objects and check the final theorem
        env:
          GH_TOKEN: ${{ github.token }}
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_frankl_span_four_final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-span-four-final-composed
          path: .candidate-artifacts/frankl-span-four-final/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
