name: Export checked loneliness geometry receipts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lean-receipt-export-loneliness-geometry-20261119.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify archive digests and expose exact receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          class PublicArtifactRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(PublicArtifactRedirect())
          specs = [{"task":"geometry-critical-seven-assembly","artifact":14505642949,"digest":"a782b0b98dbe8cb45be98699e362037dc1b0e9b9f6437d61bd16fffbead7335f","modules":72,"required":5,"path":"docs/verification/loneliness-critical-seven-assembly-bc058950.json","commit":"bc05895024c5b2a9811ed2e2f697f404e200ec10","checks":["source build","all-declaration axiom whitelist","independent exact-closure kernel replay"]},{"task":"geometry-large-norm","artifact":14505111016,"digest":"32a01447d08c54d6a47d145bb63624cb9c53cc38b4818ae66ebe53f09cdd29a7","modules":81,"required":2,"path":"docs/verification/loneliness-large-norm-3f6ee74c.json","commit":"3f6ee74c8bc1f2aba43ccd1cb44f2e9941016fe8","checks":["source build","all-declaration axiom whitelist","independent exact-closure kernel replay"]},{"task":"geometry-large-norm","artifact":14524610813,"digest":"b55baa3c67e81767ce2c8e213c9711d329f8446ae13ea0ebac96c6452e070248","modules":81,"required":2,"path":"docs/verification/loneliness-large-norm-cadb700e.json","commit":"cadb700e7275582f6bd8bdb7f8637743c60b1ed0","checks":["source build","all-declaration axiom whitelist","independent exact-closure kernel replay"]}]
          for spec in specs:
              url = ('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
                     + '/actions/artifacts/' + str(spec['artifact']) + '/zip')
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'lean-receipt-export'})
              payload = opener.open(request, timeout=60).read()
              assert hashlib.sha256(payload).hexdigest() == spec['digest'], 'Artifact digest mismatch'
              archive = zipfile.ZipFile(io.BytesIO(payload))
              matches = [n for n in archive.namelist() if n == 'receipt.json' or n.endswith('/receipt.json')]
              assert len(matches) == 1, matches
              receipt = json.loads(archive.read(matches[0]))
              assert receipt['commit'] == spec['commit']
              assert receipt['task'] == spec['task']
              assert receipt['status'] == 'passed'
              assert len(receipt['project_modules']) == spec['modules']
              assert len(receipt['required_theorems']) == spec['required']
              assert receipt['completed_checks'] == spec['checks']
              print('RECEIPT_JSON ' + spec['path'] + ' ' +
                    json.dumps(receipt, sort_keys=True, separators=(',', ':')), flush=True)
              print('PASS exact archive and receipt metadata: ' + spec['task'])
          PY
