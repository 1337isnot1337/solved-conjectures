name: Preserve original Frankl residual-tail receipt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frankl-residual-tail-receipt.yml'
      - 'scripts/preserve_frankl_residual_tail_receipt.py'

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate and preserve the original successful Tail evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_frankl_residual_tail_receipt.py
