name: Preserve exact Frankl transport receipts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frankl-transport-receipts.yml'
      - 'scripts/preserve_frankl_transport_receipts.py'
      - 'scripts/test_frankl_transport_receipts.py'
  workflow_run:
    workflows:
      - Lean Frankl source-grouped transport batches
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: frankl-transport-receipts-${{ github.event.workflow_run.id || 44513150579 }}
  cancel-in-progress: false

jobs:
  preserve:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.id == 44513150579 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exact receipt and archive validation
        run: |
          python3 -m py_compile scripts/preserve_frankl_transport_receipts.py scripts/test_frankl_transport_receipts.py
          python3 -m unittest discover -s scripts -p test_frankl_transport_receipts.py -v
      - name: Verify original archives and preserve immutable passed-group evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_frankl_transport_receipts.py
