name: Gawron–Miska–Ulas’s Thue–Morse sign-density conjecture
on:
  pull_request:
    paths:
      - 'lean/Conjectures/ThueMorseSignDensity.lean'
      - 'lean/Conjectures/ThueMorseSignDensityCore.lean'
      - 'lean/Conjectures/ThueMorseValuationBasic.lean'
      - '.github/workflows/lean-thue-morse-sign-density.yml'
      - 'lean/lean-toolchain'
      - 'lean/lake-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Strict source compilation
        working-directory: lean
        run: |
          mkdir -p .lake/build/lib/lean/Conjectures
          lake env lean -j1 -DwarningAsError=true -o .lake/build/lib/lean/Conjectures/ThueMorseValuationBasic.olean Conjectures/ThueMorseValuationBasic.lean
          lake env lean -j1 -DwarningAsError=true -o .lake/build/lib/lean/Conjectures/ThueMorseSignDensityCore.olean Conjectures/ThueMorseSignDensityCore.lean
          lake env lean -j1 -DwarningAsError=true -o .lake/build/lib/lean/Conjectures/ThueMorseSignDensity.olean Conjectures/ThueMorseSignDensity.lean
      - name: Generate all-owned axiom audit
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import audit_lean_all_owned as audit
          modules = ['Conjectures.ThueMorseValuationBasic', 'Conjectures.ThueMorseSignDensityCore', 'Conjectures.ThueMorseSignDensity']
          required = ['ThueMorseSignDensity.' + n for n in [
              'recurrence', 't_even', 't_odd', 't_nonzero', 'identity0', 'identity1',
              'lower_bound0', 'lower_bound1', 'not_zero_density0',
              'not_zero_density1', 'conjecture_false']]
          required += ['ThueMorseSignDensityCore.' + n for n in [
              'parity_pair', 'nonzero', 'identity0', 'identity1', 'block0', 'block1',
              'lower_bound0', 'lower_bound1', 'not_zero_density0', 'not_zero_density1']]
          Path('lean/ThueMorseSignDensityTargetAudit.lean').write_text(
              audit.audit_source(modules, required, []))
          PY
      - name: All-owned axiom audit
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean -j1 -DwarningAsError=true ThueMorseSignDensityTargetAudit.lean | tee ../thue-morse-sign-density-audit.log
      - name: Validate audit inventory
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import audit_lean_all_owned as audit
          modules = ['Conjectures.ThueMorseValuationBasic', 'Conjectures.ThueMorseSignDensityCore', 'Conjectures.ThueMorseSignDensity']
          required = ['ThueMorseSignDensity.' + n for n in [
              'recurrence', 't_even', 't_odd', 't_nonzero', 'identity0', 'identity1',
              'lower_bound0', 'lower_bound1', 'not_zero_density0',
              'not_zero_density1', 'conjecture_false']]
          required += ['ThueMorseSignDensityCore.' + n for n in [
              'parity_pair', 'nonzero', 'identity0', 'identity1', 'block0', 'block1',
              'lower_bound0', 'lower_bound1', 'not_zero_density0', 'not_zero_density1']]
          result = audit.validate_log(
              Path('thue-morse-sign-density-audit.log').read_text(),
              {'modules': modules, 'required': required, 'legacy_prefixes': []},
              {module: True for module in modules})
          print(result['summary'])
          PY
      - name: Replay exact local import closure using stock kernel
        working-directory: lean
        run: lake env python3 ../scripts/replay_lean.py --root Conjectures.ThueMorseSignDensity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thue-morse-sign-density-axiom-audit
          path: thue-morse-sign-density-audit.log
