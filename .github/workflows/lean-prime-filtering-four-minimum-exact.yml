name: Lean four-minimum runner case exact sources and kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify_prime_filtering_four_minimum_exact.py"
      - "docs/prime-filtering-four-minimum-exact-sources.json"
      - ".github/workflows/lean-prime-filtering-four-minimum-exact.yml"
      - "lean/Conjectures/Loneliness.lean"
      - "lean/Conjectures/LonelinessContinuity.lean"
      - "lean/Conjectures/LonelinessCriticalBase.lean"
      - "lean/Conjectures/LonelinessFiveFamily.lean"
      - "lean/Conjectures/LonelinessModularWitness.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourActions.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourArithmetic.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCanonicalCheck.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCellMap.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate1.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate2.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate3.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate4.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate5.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate6.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate7.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate8.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourCertificate9.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourFinite.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourMinimum.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourMinimumData.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourPlusTwo.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourProfiles.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourRows.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourSearch.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourSoundness.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringFourTransport.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringSampling.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringTwoHigherPair.lean"
      - "lean/Conjectures/LonelinessPrimeFilteringTwoHigherSeed.lean"
      - "lean/Conjectures/LonelinessRational.lean"
      - "lean/lean-toolchain"
      - "lean/lakefile.toml"
      - "lean/lake-manifest.json"
      - "scripts/audit_lean_all_owned.py"
      - "scripts/build_lean_parallel.py"
      - "scripts/plan_accepted_lean.py"
      - "scripts/plan_lean_candidates.py"
      - "scripts/replay_lean.py"
      - "scripts/verify_frankl_orbit_batches.py"
      - "scripts/verify_lean_candidate.py"
      - "scripts/audit_lean_raw_occurrences.py"

permissions:
  contents: read

concurrency:
  group: lean-prime-filtering-four-minimum-exact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact proof and helper inventory
        run: |
          python3 -m py_compile scripts/verify_prime_filtering_four_minimum_exact.py
          python3 scripts/verify_prime_filtering_four_minimum_exact.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh strict sources, complete raw-body audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_prime_filtering_four_minimum_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-filtering-four-minimum-exact
          path: .candidate-artifacts/prime-filtering-four-minimum-exact/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
