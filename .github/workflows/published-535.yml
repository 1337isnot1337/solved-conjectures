name: Published conjectures scoped verification
on:
  push:
    branches:
      - 'review/*535*'
    paths:
      - 'lean/Conjectures/**'
      - 'docs/verification/published-535-targets.json'
      - 'scripts/verify_published_535.py'
      - '.github/workflows/published-535.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/**'
      - 'docs/verification/published-535-targets.json'
      - 'scripts/verify_published_535.py'
      - '.github/workflows/published-535.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-535-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Strict source, all-owned axiom audit, stock kernel
        run: python3 scripts/verify_published_535.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-535-verification
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
          path: |
            .candidate-artifacts/published-535/
            lean/Published535Audit.lean
            docs/verification/published-535-targets.json
