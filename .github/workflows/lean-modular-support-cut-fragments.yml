name: Lean modular support cut fragments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-modular-support-cut-fragments.yml'
      - 'docs/modular-support-cut-fragments-sources.json'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessContinuity.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessFourSpeedCertificate.lean'
      - 'lean/Conjectures/LonelinessFourSpeedEnumeration.lean'
      - 'lean/Conjectures/LonelinessModularCoverBits.lean'
      - 'lean/Conjectures/LonelinessModularCoverChunks.lean'
      - 'lean/Conjectures/LonelinessModularCoverCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCuts.lean'
      - 'lean/Conjectures/LonelinessModularCoverSearch.lean'
      - 'lean/Conjectures/LonelinessModularCoverTape.lean'
      - 'lean/Conjectures/LonelinessModularInitialBits.lean'
      - 'lean/Conjectures/LonelinessModularInitialMemo.lean'
      - 'lean/Conjectures/LonelinessModularInitialSupport.lean'
      - 'lean/Conjectures/LonelinessModularMemo.lean'
      - 'lean/Conjectures/LonelinessModularNormalize.lean'
      - 'lean/Conjectures/LonelinessModularRationalWitness.lean'
      - 'lean/Conjectures/LonelinessModularStrictWitness.lean'
      - 'lean/Conjectures/LonelinessModularSupportLists.lean'
      - 'lean/Conjectures/LonelinessModularWitness.lean'
      - 'lean/Conjectures/LonelinessRational.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/generate_modular_initial_support.py'
      - 'scripts/generate_modular_support_cut_fragments.py'
      - 'scripts/generate_six_speed_prime_arithmetic.py'
      - 'scripts/generate_six_speed_prime_assembly.py'
      - 'scripts/generate_six_speed_prime_certificates.py'
      - 'scripts/generate_six_speed_prime_fast.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_modular_support_cut_fragments.py'
      - 'scripts/verify_six_speed_prime_batches.py'
      - 'scripts/verify_six_speed_prime_pipeline.py'

permissions:
  contents: read

concurrency:
  group: lean-modular-support-cut-fragments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Check frozen numerical reproduction
        run: |
          python3 -m py_compile scripts/verify_modular_support_cut_fragments.py scripts/generate_modular_support_cut_fragments.py
          python3 scripts/generate_modular_support_cut_fragments.py --self-test
          python3 scripts/verify_modular_support_cut_fragments.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh strict sources, all-owned audit and exact stock replay
        run: python3 scripts/verify_modular_support_cut_fragments.py
      - name: Preserve exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-support-cut-fragments-${{ github.sha }}
          path: .candidate-artifacts/modular-support-cut-fragments/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
