name: Lean SWAR counter equivalence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-modular-cover-swar-counts.yml'
      - 'docs/modular-cover-swar-counts-sources.json'
      - 'lean/Conjectures/LonelinessModularCoverByteCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverFastCounts.lean'
      - 'lean/Conjectures/LonelinessModularCoverSwarCounts.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/audit_lean_owned_extension.py'
      - 'scripts/audit_lean_raw_occurrences.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/test_audit_lean_raw_occurrences.py'
      - 'scripts/test_modular_cover_swar_counts.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_modular_cover_swar_counts.py'
      - 'scripts/verify_renault_foundations.py'

permissions:
  contents: read

concurrency:
  group: lean-modular-cover-swar-counts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check frozen source scope and verification protocol
        run: |
          python3 scripts/test_audit_lean_raw_occurrences.py
          python3 scripts/test_modular_cover_swar_counts.py
          python3 scripts/verify_modular_cover_swar_counts.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh sources, all raw proof bodies and exact stock targets
        timeout-minutes: 45
        run: >-
          python3 scripts/verify_modular_cover_swar_counts.py
          --artifact-dir .candidate-artifacts/modular-cover-swar-counts/
      - name: Preserve original verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-cover-swar-counts-${{ github.sha }}
          path: .candidate-artifacts/modular-cover-swar-counts/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
