name: Rowland–Sistos Barrón conjecture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lean/Conjectures/RowlandSistosBarron*.lean'
      - 'scripts/verify_lean_target.py'
      - '.github/workflows/lean-rowland-sistos-barron.yml'
  push:
    branches: [research, main]
    paths:
      - 'lean/Conjectures/RowlandSistosBarron*.lean'
      - 'scripts/verify_lean_target.py'
      - '.github/workflows/lean-rowland-sistos-barron.yml'
      - 'lean/lean-toolchain'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Strict source, all-owned audit, and stock-kernel replay
        run: >-
          python3 scripts/verify_lean_target.py
          --root Conjectures.RowlandSistosBarronTheorem
          --require RowlandSistosBarron.isTailRecurrence_iff
          --require RowlandSistosBarron.exponentialPolynomial_tailRecurrenceRank
          --require RowlandSistosBarron.poweredSequence_eq_exponential_sum
          --require RowlandSistosBarron.poweredSequence_tailRecurrenceRank
          --require RowlandSistosBarron.integerSequence_rank_six
          --require RowlandSistosBarron.coefficientRank_formula
          --require RowlandSistosBarron.square_cancellation_count
          --require RowlandSistosBarron.rankSequence_formula_div
          --require RowlandSistosBarron.rankSequence_not_eventuallyQuasipolynomial
          --require RowlandSistosBarron.particularRankConjecture_false
          --require RowlandSistosBarron.rowland_sistos_barron_counterexample
          --out .candidate-artifacts/rowland-sistos-barron
      - uses: actions/upload-artifact@v4
        with:
          name: rowland-sistos-barron
          path: .candidate-artifacts/rowland-sistos-barron/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
