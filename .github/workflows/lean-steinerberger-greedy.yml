name: Steinerberger’s greedy-energy Fourier conjecture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &proof_paths
      - 'lean/Conjectures/SteinerbergerGreedy*.lean'
      - 'lean/Conjectures.lean'
      - 'lean/ProofAudit.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_lean.sh'
      - 'scripts/verify_steinerberger_greedy.py'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/replay_lean.py'
      - 'scripts/replay_lean_parallel.py'
      - '.github/workflows/lean-steinerberger-greedy.yml'
  pull_request:
    branches: [main]
    paths: *proof_paths

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Strict source builds, complete axiom audit, and stock-kernel replay
        working-directory: lean
        run: lake env python3 ../scripts/verify_steinerberger_greedy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steinerberger-greedy-verification
          path: .candidate-artifacts/steinerberger-greedy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
