name: Lean p199 contiguous C1024 root cover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-five-speed-root-cblock1024.yml'
      - 'scripts/verify_five_speed_root_cblock1024.py'
      - 'docs/five-speed-root-cblock1024-inputs.json'
      - 'results/five-speed-spectrum/generate_lean_root_cblock_budget.py'

permissions:
  contents: read

concurrency:
  group: lean-five-speed-root-cblock1024
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the separate C1024 layout and unchanged scalar oracle
        run: |
          python3 -m py_compile scripts/verify_five_speed_root_cblock1024.py
          python3 scripts/verify_five_speed_root_cblock1024.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, every owned declaration, and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_five_speed_root_cblock1024.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-speed-root-cblock1024
          path: .candidate-artifacts/five-speed-root-cblock1024/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
