permissions:
  contents: read

jobs:
  integration-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Strict source, all-declaration audit and exact stock replay
        run: python3 scripts/verify_frankl_graph_integration_helpers.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-graph-integration-helpers
          path: .candidate-artifacts/frankl-graph-integration-helpers/
          if-no-files-found: warn
          retention-days: 14
