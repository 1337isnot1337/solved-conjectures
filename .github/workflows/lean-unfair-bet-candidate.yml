name: Lean unfair-bet overlap candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lean/Conjectures/EkhadZeilbergerOverlap.lean'
      - 'scripts/verify_unfair_bet_candidate.py'
      - '.github/workflows/lean-unfair-bet-candidate.yml'
      - 'scripts/verify_lean_candidate.py'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Strict source, axiom audit and kernel replay
        run: python3 scripts/verify_unfair_bet_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-unfair-bet-overlap
          path: .candidate-artifacts/unfair-bet-overlap/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
