name: Lean six-through-eight speed norm bounds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-loneliness-small-norm-exact.yml'
      - 'scripts/verify_loneliness_small_norm_exact.py'
      - 'docs/loneliness-small-norm-exact-sources.json'
      - 'lean/Conjectures/LonelinessKZBasisVectors.lean'
      - 'lean/Conjectures/LonelinessNearestPlane.lean'
      - 'lean/Conjectures/LonelinessKZBasisGram.lean'
      - 'lean/Conjectures/LonelinessKZBasisInteger.lean'
      - 'lean/Conjectures/LonelinessKZBasisOperations.lean'
      - 'lean/Conjectures/LonelinessNearestPlaneRelative.lean'
      - 'lean/Conjectures/LonelinessKZBasisStep.lean'
      - 'lean/Conjectures/LonelinessKZBasisReduction.lean'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessContinuity.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessSubspaceDensity.lean'
      - 'lean/Conjectures/LonelinessHyperplaneArithmetic.lean'
      - 'lean/Conjectures/LonelinessPrimitiveBasis.lean'
      - 'lean/Conjectures/LonelinessPrimitiveSpeeds.lean'
      - 'lean/Conjectures/LonelinessNearestPlaneValue.lean'
      - 'lean/Conjectures/LonelinessCoalescence.lean'
      - 'lean/Conjectures/LonelinessCoordinateSubspace.lean'
      - 'lean/Conjectures/LonelinessCoordinateClasses.lean'
      - 'lean/Conjectures/LonelinessIntegerDirection.lean'
      - 'lean/Conjectures/LonelinessRationalSubspace.lean'
      - 'lean/Conjectures/LonelinessCoalescenceValue.lean'
      - 'lean/Conjectures/LonelinessNearestPlanePrefix.lean'
      - 'lean/Conjectures/LonelinessPrefixProduct.lean'
      - 'lean/Conjectures/LonelinessPrefixProductTables.lean'
      - 'lean/Conjectures/LonelinessKZProductCertificate.lean'
      - 'lean/Conjectures/LonelinessKZProductOrder.lean'
      - 'lean/Conjectures/LonelinessKZProductAssembly.lean'
      - 'lean/Conjectures/LonelinessKZGeneral.lean'
      - 'lean/Conjectures/LonelinessNormGeometry.lean'
      - 'lean/Conjectures/LonelinessTightNormCommon.lean'
      - 'lean/Conjectures/LonelinessKZSmallData.lean'
      - 'lean/Conjectures/LonelinessModularPrimes.lean'
      - 'lean/Conjectures/LonelinessRational.lean'
      - 'lean/Conjectures/LonelinessModularWitness.lean'
      - 'lean/Conjectures/LonelinessModularForcedDivisor.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDefs.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeProducts.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataSix.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataSeven.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataEight.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataNine.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataTen.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataEleven.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataTwelve.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeDataThirteen.lean'
      - 'lean/Conjectures/LonelinessModularTightPrimeBounds.lean'
      - 'lean/Conjectures/LonelinessTightSmallNormBounds.lean'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/replay_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

concurrency:
  group: lean-loneliness-small-norm-exact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact source and helper inventory
        run: |
          python3 -m py_compile scripts/verify_loneliness_small_norm_exact.py
          python3 scripts/verify_loneliness_small_norm_exact.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, all-owned private audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_loneliness_small_norm_exact.py
      - name: Show reached Lean source or audit errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path(".candidate-artifacts/loneliness-small-norm-exact/logs").glob("*.log")):
              value = path.read_text()
              if "error:" in value or "warning:" in value:
                  print(str(path))
                  print(value[-24000:])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loneliness-small-norm-exact
          path: .candidate-artifacts/loneliness-small-norm-exact/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
