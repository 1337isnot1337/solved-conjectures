      - 'lean/Conjectures/LonelinessCriticalSecond.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessHyperplaneArithmetic.lean'
      - 'lean/Conjectures/LonelinessIntegerDirection.lean'
      - 'lean/Conjectures/LonelinessKZBasisGram.lean'
      - 'lean/Conjectures/LonelinessKZBasisInteger.lean'
      - 'lean/Conjectures/LonelinessKZBasisOperations.lean'
      - 'lean/Conjectures/LonelinessKZBasisReduction.lean'
      - 'lean/Conjectures/LonelinessKZBasisStep.lean'
      - 'lean/Conjectures/LonelinessKZBasisVectors.lean'
      - 'lean/Conjectures/LonelinessKZGeneral.lean'
      - 'lean/Conjectures/LonelinessKZProductAssembly.lean'
      - 'lean/Conjectures/LonelinessKZProductCertificate.lean'
      - 'lean/Conjectures/LonelinessKZProductOrder.lean'
      - 'lean/Conjectures/LonelinessKZSmallData.lean'
      - 'lean/Conjectures/LonelinessLatticeCovolume.lean'
      - 'lean/Conjectures/LonelinessNearestPlane.lean'
      - 'lean/Conjectures/LonelinessNearestPlanePrefix.lean'
      - 'lean/Conjectures/LonelinessNearestPlaneRelative.lean'
      - 'lean/Conjectures/LonelinessNearestPlaneValue.lean'
      - 'lean/Conjectures/LonelinessNormGeometry.lean'
      - 'lean/Conjectures/LonelinessNormalization.lean'
      - 'lean/Conjectures/LonelinessPacking.lean'
      - 'lean/Conjectures/LonelinessPackingLower.lean'
      - 'lean/Conjectures/LonelinessPrefixProduct.lean'
      - 'lean/Conjectures/LonelinessPrefixProductTables.lean'
      - 'lean/Conjectures/LonelinessPrimitiveBasis.lean'
      - 'lean/Conjectures/LonelinessPrimitiveSpeeds.lean'
      - 'lean/Conjectures/LonelinessRational.lean'
      - 'lean/Conjectures/LonelinessRationalLattice.lean'
      - 'lean/Conjectures/LonelinessRationalSubspace.lean'
      - 'lean/Conjectures/LonelinessRectangularGram.lean'
      - 'lean/Conjectures/LonelinessRectangularGramLowerBound.lean'
      - 'lean/Conjectures/LonelinessRectangularLattice.lean'
      - 'lean/Conjectures/LonelinessSixSpectrumLatticeNorm.lean'
      - 'lean/Conjectures/LonelinessSixSpectrumNormGeometry.lean'
      - 'lean/Conjectures/LonelinessSmallRunner.lean'
      - 'lean/Conjectures/LonelinessSubspaceDensity.lean'
      - 'lean/Conjectures/NonmixedGapDensity.lean'
      - 'lean/Conjectures/NonmixedGapPeriodic.lean'
      - 'lean/Conjectures/NonmixedGapResidues.lean'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'

permissions:
  contents: read

concurrency:
  group: lean-rectangular-lattice-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source and control inventory
        run: |
          python3 -m py_compile scripts/verify_rectangular_lattice_exact.py
          python3 scripts/verify_rectangular_lattice_exact.py algebra --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict sources, all-owned audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_rectangular_lattice_exact.py algebra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rectangular-lattice-algebra
          path: .candidate-artifacts/rectangular-lattice-algebra/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
