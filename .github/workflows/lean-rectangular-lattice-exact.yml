      - 'lean/Conjectures/HaralambisOrientation.lean'
      - 'lean/Conjectures/HaralambisPairSum.lean'
      - 'lean/Conjectures/HaralambisPeriods.lean'
      - 'lean/Conjectures/HaralambisTheorem.lean'
      - 'lean/Conjectures/Loneliness.lean'
