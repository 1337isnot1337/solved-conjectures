name: Ferreira–Simon stochastic-order candidate
on:
  pull_request:
    branches: [research]
    paths:
      - 'lean/Conjectures/FerreiraSimonStochastic.lean'
      - '.github/workflows/lean-ferreira-simon-stochastic-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Strict target build, complete axiom audit, stock replay
        run: |
          python3 scripts/verify_lean_target.py \
            --root Conjectures.FerreiraSimonStochastic \
            --require Conjectures.FerreiraSimonStochastic.inverse_power_sums_strict \
            --require Conjectures.FerreiraSimonStochastic.strict_parameter_order \
            --out /tmp/ferreira-simon-stochastic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferreira-simon-stochastic-candidate
          path: /tmp/ferreira-simon-stochastic/
