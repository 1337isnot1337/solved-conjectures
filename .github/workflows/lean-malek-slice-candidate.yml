name: Malek's conjecture
on:
  pull_request:
    branches: [research]
    paths:
      - 'lean/Conjectures/MalekSlice.lean'
      - '.github/workflows/lean-malek-slice-candidate.yml'
      - 'scripts/verify_lean_target.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Strict compilation, all-owned axiom audit and kernel replay
        run: |
          cd lean
          lake env python3 ../scripts/verify_lean_target.py --root Conjectures.MalekSlice --require MalekSubpermanent.slice_cubic_pos --require MalekSubpermanent.slice_radical_gap --require MalekSubpermanent.slice_contradiction --require MalekSubpermanent.normalized_slice_bound --require MalekSubpermanent.upper_gap --require MalekSubpermanent.initial_gaps --require MalekSubpermanent.transform_strict_of_estimates --out ../.candidate-artifacts/malek-slice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malek-slice-verification
          path: .candidate-artifacts/malek-slice/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
