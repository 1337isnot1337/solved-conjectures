name: Preserve exact prime257 terminal rows

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/preserve_six_speed_prime0257_rows.py'
      - '.github/workflows/preserve-six-speed-prime0257-rows.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: preserve-six-speed-prime0257-rows-44533829046
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check fixed evidence protocol fixtures
        run: |
          python3 -m py_compile scripts/preserve_six_speed_prime0257_rows.py
          python3 scripts/preserve_six_speed_prime0257_rows.py --self-test
      - name: Authenticate all original proof and process evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_six_speed_prime0257_rows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-speed-prime0257-rows-preservation
          path: .candidate-artifacts/six-speed-prime0257-rows-preservation/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
