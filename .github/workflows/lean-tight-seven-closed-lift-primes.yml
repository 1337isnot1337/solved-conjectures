permissions:
  contents: read

concurrency:
  group: lean-tight-seven-closed-lift-primes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the exact source and scope model
        run: |
          python3 -m py_compile scripts/verify_tight_seven_closed_lift_primes.py
          python3 scripts/verify_tight_seven_closed_lift_primes.py --preflight
      - id: plan
        run: python3 scripts/verify_tight_seven_closed_lift_primes.py --matrix >> "$GITHUB_OUTPUT"
  primes:
    needs: plan
    name: prime ${{ matrix.prime }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh exact prime source, audit and stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_tight_seven_closed_lift_primes.py --prime ${{ matrix.prime }}
      - name: Preserve exact prime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tight-seven-closed-lift-prime-${{ matrix.id }}
          path: .candidate-artifacts/tight-seven-closed-lift-primes/${{ matrix.id }}/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
  assemble:
    needs: primes
    if: ${{ always() && (needs.primes.result == 'success' || needs.primes.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tight-seven-closed-lift-prime-*
          path: .candidate-inputs/tight-seven-closed-lift-primes
      - name: Authenticate every prime and check the aggregate
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_tight_seven_closed_lift_primes.py --assemble --artifacts .candidate-inputs/tight-seven-closed-lift-primes
      - name: Preserve complete composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tight-seven-closed-lift-complete-${{ github.sha }}
          path: .candidate-artifacts/tight-seven-closed-lift-primes/complete/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
