name: lean-erdos-708-interval-product

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan & Setup Lean
        uses: leanprover/lean-action@v1
      - name: Build and Verify Erdos 708 Interval Product
        run: |
          lake build
