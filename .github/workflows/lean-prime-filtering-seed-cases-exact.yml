permissions:
  contents: read

concurrency:
  group: lean-prime-filtering-seed-cases-exact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact proof and helper inventory
        run: |
          python3 -m py_compile scripts/verify_prime_filtering_seed_cases_exact.py
          python3 scripts/verify_prime_filtering_seed_cases_exact.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh strict sources, complete raw-body audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_prime_filtering_seed_cases_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-filtering-seed-cases-exact
          path: .candidate-artifacts/prime-filtering-seed-cases-exact/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
