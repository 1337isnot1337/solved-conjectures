name: Lean proofs and certificates
on:
  push:
  pull_request:
jobs:
  lean:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Audit all project axioms and recheck compiled proofs
        run: scripts/verify_lean.sh
