name: Lean proofs and certificates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  plan:
    name: Select accepted-source verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check accepted-source selection controls
        run: python3 -m unittest discover -s scripts -p 'test_plan_accepted_lean.py'
      - name: Check conservative diff and layout controls
        run: python3 scripts/plan_accepted_lean.py --self-test
      - id: plan
        run: python3 scripts/plan_accepted_lean.py
  lean:
    needs: plan
    # Planner failure or missing output must never skip proof verification.
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Audit all project axioms and recheck compiled proofs
        run: scripts/verify_lean.sh
