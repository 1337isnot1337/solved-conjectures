name: Lean proofs and certificates
on:
  push:
  pull_request:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: lean
          build: true
      - name: Audit all project axioms and recheck compiled proofs
        run: scripts/verify_lean.sh
