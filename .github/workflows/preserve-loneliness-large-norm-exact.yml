name: Preserve exact conditional large-norm proof

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/preserve_loneliness_large_norm_exact.py'
      - '.github/workflows/preserve-loneliness-large-norm-exact.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: preserve-loneliness-large-norm-exact
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check evidence protocol fixtures
        run: |
          python3 -m py_compile scripts/preserve_loneliness_large_norm_exact.py
          python3 scripts/preserve_loneliness_large_norm_exact.py --self-test
      - name: Authenticate all original proof and process evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_loneliness_large_norm_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loneliness-large-norm-preservation
          path: .candidate-artifacts/loneliness-large-norm-preservation/
          retention-days: 30
          if-no-files-found: error
