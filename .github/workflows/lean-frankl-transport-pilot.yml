name: Lean Frankl explicit transport pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-frankl-transport-pilot.yml'
      - 'scripts/verify_frankl_transport_pilot.py'
      - 'results/frankl-generator-families/generate_small_cyclic_weight_transport_pilot.py'
      - 'lean/Conjectures/FranklSmallCyclicOrbitTransportPilot*.lean'

permissions:
  contents: write

jobs:
  transport128:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Generate and independently reproduce the bounded witnesses
        run: python3 scripts/verify_frankl_transport_pilot.py prepare
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Strict source, every owned declaration, exact stock kernel
        run: python3 scripts/verify_frankl_transport_pilot.py verify --jobs 4
      - name: Publish checked sources and exact receipt without changing registries
        run: python3 scripts/verify_frankl_transport_pilot.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-transport128
          path: |
            .candidate-artifacts/frankl-transport-pilot/
            .candidate-artifacts/frankl-transport-preparation.json
            results/frankl-generator-families/small_cyclic_weight_transport_pilot.json
            lean/Conjectures/FranklSmallCyclicOrbitTransportPilot*.lean
          retention-days: 14
