name: Export checked Lean receipts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lean-receipt-export-20261119.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify archive digests and expose exact receipt JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          class PublicArtifactRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(PublicArtifactRedirect())
          records = json.loads("[{\"path\":\"docs/verification/erdos-gyarfas-sharp-main-c6735b93.json\",\"artifact\":14516552122,\"sha256\":\"c7888021235392b4e899b7c4e45530775ffa5f8b9aaea7811020ddc9ede8936c\",\"commit\":\"c6735b9342ccd271ffe3604876708bbe95266472\",\"modules\":7},{\"path\":\"docs/verification/erdos-gyarfas-voltage-normalization-0cf8667d.json\",\"artifact\":14515689424,\"sha256\":\"b31291306964c526bf4fac63580e3cb8e346f25b7cb9725faa56826ef5cef0a5\",\"commit\":\"0cf8667d7749ca8316ac02ce5cf9e48d8048f437\",\"modules\":4},{\"path\":\"docs/verification/hadamard-fixed-border-fin16-23b2b187.json\",\"artifact\":14516615183,\"sha256\":\"66c30c628f14f420c703d84b568675139d867ecb62b21672f5409d6980e4b86b\",\"commit\":\"23b2b187209327078a186e72685c734f0df3a477\",\"modules\":2},{\"path\":\"docs/verification/hadamard-border-normalization-main-14ab84e7.json\",\"artifact\":14516591527,\"sha256\":\"208c005d603905f0bf6bef88214641efe143f4a80366c92b1705bf8632c50dbb\",\"commit\":\"14ab84e7c177f85609af381e526583ba9a5a4dab\",\"modules\":2}]")
          for record in records:
              url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/artifacts/' + str(record['artifact']) + '/zip'
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'lean-receipt-export'})
              payload = opener.open(request, timeout=60).read()
              assert hashlib.sha256(payload).hexdigest() == record['sha256'], 'Artifact digest mismatch'
              archive = zipfile.ZipFile(io.BytesIO(payload))
              assert archive.namelist() == ['receipt.json'], 'Unexpected artifact members'
              receipt = json.loads(archive.read('receipt.json'))
              assert receipt['commit'] == record['commit']
              assert receipt['status'] == 'passed' and len(receipt['completed_checks']) == 3
              assert not receipt.get('source_failures')
              assert receipt['checked_sources'] == receipt['project_modules']
              assert len(receipt['project_modules']) == record['modules']
              print('RECEIPT_JSON ' + record['path'] + ' ' + json.dumps(receipt, sort_keys=True, separators=(',', ':')), flush=True)
          print('PASS: all four original receipt archives match their pinned digests')
          PY
