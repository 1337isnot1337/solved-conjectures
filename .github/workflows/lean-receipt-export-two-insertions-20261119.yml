name: Export checked two-insertion receipts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lean-receipt-export-two-insertions-20261119.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify archive digests and expose exact receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          class PublicArtifactRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(PublicArtifactRedirect())
          specs = [{"task":"geometry-two-insertion-accelerations","artifact":14517984497,"digest":"3a8059fcdc99a64a17645c229c7d910daef337dba0fa517158d1aa00fdb117fd","modules":26,"required":5,"path":"docs/verification/two-insertion-accelerations-9c7610e7.json"},{"task":"geometry-two-insertion-obstruction","artifact":14517804621,"digest":"093f3d294274a896508147ea59d34fdd801af2ae5cf96179de1d7e89db2ec1af","modules":5,"required":3,"path":"docs/verification/two-insertion-obstruction-9c7610e7.json"}]
          for spec in specs:
              url = ('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
                     + '/actions/artifacts/' + str(spec['artifact']) + '/zip')
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'lean-receipt-export'})
              payload = opener.open(request, timeout=60).read()
              assert hashlib.sha256(payload).hexdigest() == spec['digest'], 'Artifact digest mismatch'
              archive = zipfile.ZipFile(io.BytesIO(payload))
              matches = [n for n in archive.namelist() if n == 'receipt.json' or n.endswith('/receipt.json')]
              assert len(matches) == 1, matches
              receipt = json.loads(archive.read(matches[0]))
              assert receipt['commit'] == '9c7610e7d04788a34f54395a20cc2dda965f45bb'
              assert receipt['task'] == spec['task']
              assert receipt['status'] == 'passed'
              assert len(receipt['project_modules']) == spec['modules']
              assert len(receipt['required_theorems']) == spec['required']
              assert receipt['completed_checks'] == [
                  'source build', 'all-declaration axiom whitelist', 'independent exact-closure kernel replay']
              print('RECEIPT_JSON ' + spec['path'] + ' ' +
                    json.dumps(receipt, sort_keys=True, separators=(',', ':')), flush=True)
              print('PASS exact archive and receipt metadata: ' + spec['task'])
          PY
