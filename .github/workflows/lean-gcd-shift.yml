      - 'lean/Conjectures/LonelinessCoordinateSubspace.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessGcdShift.lean'
      - 'lean/Conjectures/LonelinessGcdShiftCounting.lean'
      - 'lean/Conjectures/LonelinessIntegerDirection.lean'
      - 'lean/Conjectures/LonelinessModularRationalWitness.lean'
      - 'lean/Conjectures/LonelinessModularStrictWitness.lean'
      - 'lean/Conjectures/LonelinessModularWitness.lean'
      - 'lean/Conjectures/LonelinessRational.lean'
      - 'lean/Conjectures/LonelinessRationalSubspace.lean'
      - 'lean/Conjectures/LonelinessSubspaceDensity.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/generate_five_runner_arithmetic.py'
      - 'scripts/generate_five_runner_assembly.py'
      - 'scripts/generate_five_runner_certificates.py'
      - 'scripts/generate_five_runner_fast.py'
      - 'scripts/generate_five_runner_fuel.py'
      - 'scripts/generate_six_speed_late_prime_batches.py'
      - 'scripts/generate_six_speed_prime_arithmetic.py'
      - 'scripts/generate_six_speed_prime_certificates.py'
      - 'scripts/generate_six_speed_prime_fast.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_five_runner_exact.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_gcd_shift.py'
      - 'scripts/verify_lean_candidate.py'
  pull_request:
    paths:
      - '.github/workflows/lean-gcd-shift.yml'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessCoalescence.lean'
      - 'lean/Conjectures/LonelinessCoalescenceValue.lean'
      - 'lean/Conjectures/LonelinessContinuity.lean'
      - 'lean/Conjectures/LonelinessCoordinateClasses.lean'
      - 'lean/Conjectures/LonelinessCoordinateSubspace.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessGcdShift.lean'
      - 'lean/Conjectures/LonelinessGcdShiftCounting.lean'
      - 'lean/Conjectures/LonelinessIntegerDirection.lean'
      - 'lean/Conjectures/LonelinessModularRationalWitness.lean'
      - 'lean/Conjectures/LonelinessModularStrictWitness.lean'
      - 'lean/Conjectures/LonelinessModularWitness.lean'
      - 'lean/Conjectures/LonelinessRational.lean'
      - 'lean/Conjectures/LonelinessRationalSubspace.lean'
      - 'lean/Conjectures/LonelinessSubspaceDensity.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/generate_five_runner_arithmetic.py'
      - 'scripts/generate_five_runner_assembly.py'
      - 'scripts/generate_five_runner_certificates.py'
      - 'scripts/generate_five_runner_fast.py'
      - 'scripts/generate_five_runner_fuel.py'
      - 'scripts/generate_six_speed_late_prime_batches.py'
      - 'scripts/generate_six_speed_prime_arithmetic.py'
      - 'scripts/generate_six_speed_prime_certificates.py'
      - 'scripts/generate_six_speed_prime_fast.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_five_runner_exact.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_gcd_shift.py'
      - 'scripts/verify_lean_candidate.py'

permissions:
  contents: read

concurrency:
  group: gcd-shift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gcd-shift-component:
    name: Fresh conditional gcd shift component
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
      UV_USE_IO_URING: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          check-lean-environment: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Validate the exact component closure and frozen controller imports
        run: python3 scripts/verify_gcd_shift.py --plan
      - name: Compile current gcd shift sources, audit every owned declaration, replay the exact closure
        working-directory: lean
        run: lake env python3 ../scripts/verify_gcd_shift.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcd-shift-${{ github.sha }}
          path: .candidate-artifacts/gcd-shift/
          include-hidden-files: 'true'
          if-no-files-found: error
          retention-days: 14
