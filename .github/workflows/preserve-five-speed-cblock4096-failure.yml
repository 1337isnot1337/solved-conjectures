name: Preserve failed C4096 memory experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/preserve_five_speed_cblock4096_failure.py'
      - '.github/workflows/preserve-five-speed-cblock4096-failure.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: preserve-five-speed-cblock4096-failure
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original failed snapshot
        run: git fetch --no-tags --depth=1 origin f581e515221aec50c91ef3741e8e380a7ae6ac43
      - name: Authenticate and preserve the failed candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/preserve_five_speed_cblock4096_failure.py
          python3 scripts/preserve_five_speed_cblock4096_failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-speed-cblock4096-failure
          path: .candidate-artifacts/five-speed-cblock4096-failure/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
