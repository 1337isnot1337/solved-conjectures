permissions:
  contents: read

concurrency:
  group: lean-six-speed-late-batches
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 -m py_compile scripts/verify_six_speed_late_batches.py
          python3 scripts/verify_six_speed_late_batches.py --preflight
          matrix=$(python3 scripts/verify_six_speed_late_batches.py --plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  shards:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          check-lean-environment: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh complete shard source, all-owned audit and exact stock prefix replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_six_speed_late_batches.py --shard '${{ matrix.id }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-speed-late-shard-${{ matrix.id }}
          path: .candidate-artifacts/six-speed-late-batches/${{ matrix.id }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  assemble:
    needs: shards
    if: ${{ always() && (needs.shards.result == 'success' || needs.shards.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - prime: 359
            tag: p0359
          - prime: 373
            tag: p0373
          - prime: 379
            tag: p0379
          - prime: 383
            tag: p0383
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          check-lean-environment: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - uses: actions/download-artifact@v4
        with:
          pattern: six-speed-late-shard-${{ matrix.tag }}-s*
          path: .candidate-artifacts/six-speed-late-inputs/${{ matrix.tag }}/
          merge-multiple: false
      - name: Authenticate exact object union and check complete classification
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: >-
          python3 scripts/verify_six_speed_late_batches.py
          --join '${{ matrix.prime }}'
          --shard-artifacts '.candidate-artifacts/six-speed-late-inputs/${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-speed-late-complete-${{ matrix.tag }}
          path: .candidate-artifacts/six-speed-late-batches/${{ matrix.tag }}-complete/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
