name: Lean Frankl literal ten-point orbit arithmetic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-frankl-literal-orbit-batches.yml'
      - 'scripts/verify_frankl_literal_orbit_batches.py'
      - 'results/frankl-generator-families/generate_literal_ten_weight_orbit_batches.py'
      - 'results/frankl-generator-families/literal_ten_weight_orbit_batches.json'
      - 'lean/Conjectures/FranklSmallCyclicOrbit10Block*.lean'

permissions:
  contents: read

jobs:
  pilot:
    name: Literal ten-point64-row pilot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the exact bounded source layout
        run: python3 results/frankl-generator-families/generate_literal_ten_weight_orbit_batches.py --check
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Strict source, all owned declarations, exact stock kernel
        run: python3 scripts/verify_frankl_literal_orbit_batches.py p10g00 --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-literal-orbit-p10g00
          path: .candidate-artifacts/frankl-orbit-p10g00/
          retention-days: 14
  remaining:
    name: Literal ten-point arithmetic ${{ matrix.group }}
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [p10g01, p10g02, p10g03, p10g04, p10g05, p10g06]
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Strict source, all owned declarations, exact stock kernel
        run: python3 scripts/verify_frankl_literal_orbit_batches.py ${{ matrix.group }} --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-literal-orbit-${{ matrix.group }}
          path: .candidate-artifacts/frankl-orbit-${{ matrix.group }}/
          retention-days: 14
