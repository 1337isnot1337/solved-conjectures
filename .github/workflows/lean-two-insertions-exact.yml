name: Lean exact two-insertion theorem

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-two-insertions-exact.yml'
      - 'scripts/verify_two_insertions_exact.py'
      - 'docs/two-insertions-exact-theorem-sources.json'
      - 'lean/Conjectures/LonelinessTwoInsertions*.lean'

permissions:
  contents: read

concurrency:
  group: lean-two-insertions-exact
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check exact original-theorem source inventory
        run: |
          python3 -m py_compile scripts/verify_two_insertions_exact.py
          python3 scripts/verify_two_insertions_exact.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, complete owned-declaration audit and stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_two_insertions_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-insertions-exact
          path: .candidate-artifacts/two-insertions-exact/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
