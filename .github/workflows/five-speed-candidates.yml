name: Five-speed certificate candidates

on:
  workflow_dispatch:
  push:
    paths:
      - 'lean/Conjectures/LonelinessFiveSpeed*.lean'
      - 'lean/Conjectures/LonelinessModular*.lean'
      - 'lean/Conjectures/BinaryAutomata.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_five_speed_candidates.py'
      - 'scripts/five_speed_candidate_tasks.json'
      - 'lean/Conjectures/LonelinessDistanceColoring.lean'
      - 'lean/Conjectures/LonelinessFiveDistanceGraph.lean'
      - 'scripts/verify_lean_candidate.py'
      - '.github/workflows/five-speed-candidates.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/LonelinessFiveSpeed*.lean'
      - 'lean/Conjectures/LonelinessModular*.lean'
      - 'lean/Conjectures/BinaryAutomata.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_five_speed_candidates.py'
      - 'scripts/five_speed_candidate_tasks.json'
      - 'lean/Conjectures/LonelinessDistanceColoring.lean'
      - 'lean/Conjectures/LonelinessFiveDistanceGraph.lean'
      - 'scripts/verify_lean_candidate.py'
      - '.github/workflows/five-speed-candidates.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/verify_five_speed_candidates.py --matrix

  certificates:
    name: Five-speed ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Compile source, audit every theorem, and replay the kernel
        run: python3 scripts/verify_five_speed_candidates.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        with:
          name: five-speed-${{ matrix.task }}
          path: .five-speed-artifacts/${{ matrix.task }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
