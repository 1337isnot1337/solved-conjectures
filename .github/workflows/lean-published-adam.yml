name: Published Adam conjecture
on:
  pull_request:
    paths:
      - 'lean/Conjectures/PublishedAdam.lean'
      - 'scripts/verify_published_adam.py'
      - '.github/workflows/lean-published-adam.yml'
  push:
    branches: [research, review/published-adam]
    paths:
      - 'lean/Conjectures/PublishedAdam.lean'
      - 'scripts/verify_published_adam.py'
      - '.github/workflows/lean-published-adam.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Strict source, axiom audit and kernel replay
        run: python3 scripts/verify_published_adam.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-published-adam
          path: .candidate-artifacts/published-adam/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
