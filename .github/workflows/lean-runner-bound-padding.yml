name: Lean runner bound padding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-runner-bound-padding.yml'
      - 'docs/runner-bound-padding-sources.json'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessCoalescence.lean'
      - 'lean/Conjectures/LonelinessCoalescenceValue.lean'
      - 'lean/Conjectures/LonelinessContinuity.lean'
      - 'lean/Conjectures/LonelinessCoordinateClasses.lean'
      - 'lean/Conjectures/LonelinessCoordinateSubspace.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessCriticalFamilies.lean'
      - 'lean/Conjectures/LonelinessCriticalSecond.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessIntegerDirection.lean'
      - 'lean/Conjectures/LonelinessNormalization.lean'
      - 'lean/Conjectures/LonelinessRationalSubspace.lean'
      - 'lean/Conjectures/LonelinessRunnerBoundPadding.lean'
      - 'lean/Conjectures/LonelinessRunnerBoundTransport.lean'
      - 'lean/Conjectures/LonelinessSubspaceDensity.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_renault_foundations.py'
      - 'scripts/verify_runner_bound_padding.py'

permissions:
  contents: read

concurrency:
  group: lean-runner-bound-padding
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Validate the frozen source model
        run: |
          python3 -m py_compile scripts/verify_runner_bound_padding.py
          python3 scripts/verify_runner_bound_padding.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, all-owned private audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_runner_bound_padding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-bound-padding-${{ github.sha }}
          path: .candidate-artifacts/runner-bound-padding/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
