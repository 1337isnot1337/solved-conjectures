name: Lean Li structure exact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_li_structure_exact.py'
      - '.github/workflows/lean-li-structure-exact.yml'
      - 'docs/li-structure-exact-sources.json'
      - 'lean/Conjectures/LiBasic.lean'
      - 'lean/Conjectures/LiStructure.lean'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'

permissions:
  contents: read

concurrency:
  group: lean-li-structure-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source and control inventory
        run: |
          python3 -m py_compile scripts/verify_li_structure_exact.py
          python3 scripts/verify_li_structure_exact.py structure --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict sources, all-owned audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_li_structure_exact.py structure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: li-structure-structure
          path: .candidate-artifacts/li-structure-structure/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
