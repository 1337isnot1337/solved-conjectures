name: Lean fixed-border construction candidates

on:
  workflow_dispatch:
    inputs:
      task:
        description: Exact component closure to check
        required: true
        default: affected
        type: choice
        options:
          - affected
          - variance
          - variance-rows
          - core-algebra
          - core
          - compression
          - compression-rows
          - normalization
          - core-action
          - inflation
          - assembly-generic
          - assembly
  push:
    paths:
      - 'lean/Conjectures/HadamardBorder*.lean'
      - 'lean/Conjectures/HadamardFixedBorder*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_hadamard_border_construction_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-hadamard-border-construction-candidates.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/HadamardBorder*.lean'
      - 'lean/Conjectures/HadamardFixedBorder*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'scripts/verify_hadamard_border_construction_candidate.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - '.github/workflows/lean-hadamard-border-construction-candidates.yml'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  plan:
    name: Select affected border construction proofs
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          REQUESTED_TASK: ${{ inputs.task || 'affected' }}
        run: python3 scripts/verify_hadamard_border_construction_candidate.py --plan-ci --requested-task "$REQUESTED_TASK"

  candidates:
    name: Fixed-border construction candidate ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check sources, audit, and replay the exact project closure
        run: python3 scripts/verify_hadamard_border_construction_candidate.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadamard-border-construction-${{ matrix.task }}-receipt
          path: .candidate-artifacts/hadamard-border-construction-${{ matrix.task }}/receipt.json
          if-no-files-found: warn
          retention-days: 7
