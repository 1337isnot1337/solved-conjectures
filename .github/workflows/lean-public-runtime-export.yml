name: Export pinned public Lean runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-public-runtime-export.yml'
      - 'scripts/export_lean_public_runtime.py'

permissions:
  contents: read

concurrency:
  group: lean-public-runtime-export-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Export pinned public files and SHA256 manifests
        run: |
          python3 -m py_compile scripts/export_lean_public_runtime.py
          python3 scripts/export_lean_public_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: lean-public-runtime-manifest
          path: |
            .public-runtime-export/manifest.json
            .public-runtime-export/manifest.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/toolchain.tar.zst.part00') != '' }}
        with:
          name: lean-public-runtime-toolchain-part00
          path: .public-runtime-export/toolchain.tar.zst.part00
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/toolchain.tar.zst.part01') != '' }}
        with:
          name: lean-public-runtime-toolchain-part01
          path: .public-runtime-export/toolchain.tar.zst.part01
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/toolchain.tar.zst.part02') != '' }}
        with:
          name: lean-public-runtime-toolchain-part02
          path: .public-runtime-export/toolchain.tar.zst.part02
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/toolchain.tar.zst.part03') != '' }}
        with:
          name: lean-public-runtime-toolchain-part03
          path: .public-runtime-export/toolchain.tar.zst.part03
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/toolchain.tar.zst.part04') != '' }}
        with:
          name: lean-public-runtime-toolchain-part04
          path: .public-runtime-export/toolchain.tar.zst.part04
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/toolchain.tar.zst.part05') != '' }}
        with:
          name: lean-public-runtime-toolchain-part05
          path: .public-runtime-export/toolchain.tar.zst.part05
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/packages.tar.zst.part00') != '' }}
        with:
          name: lean-public-runtime-packages-part00
          path: .public-runtime-export/packages.tar.zst.part00
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/packages.tar.zst.part01') != '' }}
        with:
          name: lean-public-runtime-packages-part01
          path: .public-runtime-export/packages.tar.zst.part01
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/packages.tar.zst.part02') != '' }}
        with:
          name: lean-public-runtime-packages-part02
          path: .public-runtime-export/packages.tar.zst.part02
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/packages.tar.zst.part03') != '' }}
        with:
          name: lean-public-runtime-packages-part03
          path: .public-runtime-export/packages.tar.zst.part03
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/packages.tar.zst.part04') != '' }}
        with:
          name: lean-public-runtime-packages-part04
          path: .public-runtime-export/packages.tar.zst.part04
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.public-runtime-export/packages.tar.zst.part05') != '' }}
        with:
          name: lean-public-runtime-packages-part05
          path: .public-runtime-export/packages.tar.zst.part05
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
