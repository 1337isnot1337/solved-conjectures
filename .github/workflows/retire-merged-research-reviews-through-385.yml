name: Retire verified merged review branches through PR 385
on:
  push:
    branches: [research]
    paths: [.github/workflows/retire-merged-research-reviews-through-385.yml]
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete only the verified temporary heads
        shell: bash
        run: |
          set -euo pipefail
          leases=()
          specs=()
          refs=()
          for pair in 'refs/heads/review/betermin-fcc-bcc-cold-spots=cbf05ccaf8d5e568e79148ec66100a0d635730e4' 'refs/heads/review/bona-pantone=81268f493a79aed40ec95b9d1fee706b900d7801' 'refs/heads/review/bona-pantone-penultimate=cffe749ab9aa669d84448cb270df2e62c931264b' 'refs/heads/review/bona-pantone-two-more=8053e7a3df277fad3ff2c6db6579f6e997be83bd'; do
            ref=${pair%%=*}
            expected=${pair#*=}
            refs+=("$ref")
            observed=$(git ls-remote origin "$ref" | cut -f1)
            if [[ -z "$observed" ]]; then
              continue
            fi
            [[ "$observed" == "$expected" ]] || { echo "Branch changed, refusing to delete $ref"; exit 1; }
            leases+=("--force-with-lease=$ref:$expected")
            specs+=(":$ref")
          done
          if (( ${#specs[@]} != 0 )); then
            git push --atomic "${leases[@]}" origin "${specs[@]}"
          fi
          [[ -z "$(git ls-remote origin "${refs[@]}")" ]]
