name: Lean Renault foundations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-renault-foundations.yml'
      - 'docs/renault-foundations-sources.json'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessContinuity.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessCriticalFamilies.lean'
      - 'lean/Conjectures/LonelinessCriticalSecond.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessNormalization.lean'
      - 'lean/Conjectures/LonelinessRenaultAffine.lean'
      - 'lean/Conjectures/LonelinessRenaultGcdOrbit.lean'
      - 'lean/Conjectures/LonelinessRenaultMaximizer.lean'
      - 'lean/Conjectures/LonelinessRenaultPhaseCells.lean'
      - 'lean/Conjectures/LonelinessRenaultPhaseCertificates.lean'
      - 'lean/Conjectures/LonelinessRenaultPreliminaries.lean'
      - 'lean/Conjectures/LonelinessRenaultReindex.lean'
      - 'lean/Conjectures/LonelinessRenaultSmallPhases.lean'
      - 'lean/Conjectures/LonelinessRenaultThirdObstructions.lean'
      - 'lean/Conjectures/LonelinessRenaultTwoMultiples.lean'
      - 'lean/Conjectures/LonelinessRenaultTwoMultiplesPhase.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/generate_renault_phase_certificates.py'
      - 'scripts/generate_renault_small_phase_certificates.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_renault_foundations.py'

permissions:
  contents: read

concurrency:
  group: lean-renault-foundations
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Validate the frozen source model
        run: |
          python3 -m py_compile scripts/verify_renault_foundations.py scripts/generate_renault_phase_certificates.py scripts/generate_renault_small_phase_certificates.py
          python3 scripts/verify_renault_foundations.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, all-owned private audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_renault_foundations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renault-foundations-${{ github.sha }}
          path: .candidate-artifacts/renault-foundations/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
