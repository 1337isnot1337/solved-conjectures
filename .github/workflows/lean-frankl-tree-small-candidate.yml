name: Lean Frankl exact small-degree tree candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'lean/Conjectures/FranklTree*.lean'
      - 'scripts/verify_frankl_tree_small_candidate.py'
      - 'docs/frankl-tree-small-candidate-sources.json'
      - '.github/workflows/lean-frankl-tree-small-candidate.yml'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_line_size_candidate.py'
      - 'scripts/replay_lean.py'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
  pull_request:
    paths:
      - 'lean/Conjectures/FranklTree*.lean'
      - 'scripts/verify_frankl_tree_small_candidate.py'
      - 'docs/frankl-tree-small-candidate-sources.json'
      - '.github/workflows/lean-frankl-tree-small-candidate.yml'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_line_size_candidate.py'
      - 'scripts/replay_lean.py'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '1'

jobs:
  tree-small:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check exact closure inventory and unchanged certificate values
        run: python3 scripts/verify_frankl_tree_small_candidate.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Strict source, every-declaration axiom audit, exact stock replay
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .candidate-artifacts
          python3 scripts/verify_frankl_tree_small_candidate.py 2>&1 | tee .candidate-artifacts/tree-small-hosted.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-tree-small-exact-candidate
          path: |
            .candidate-artifacts/frankl-tree-small/
            .candidate-artifacts/tree-small-hosted.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
