name: Export checked five-speed receipt

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lean-receipt-export-five-speed-20261119.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify archive digest and expose exact p179 receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          class PublicArtifactRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(PublicArtifactRedirect())
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/artifacts/14505984269/zip'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'lean-receipt-export'})
          payload = opener.open(request, timeout=60).read()
          assert hashlib.sha256(payload).hexdigest() == 'd4514866c33ee2ac70b3288a7757877ad89f9612f8f4f854424e67cdb2a4d3e0', 'Artifact digest mismatch'
          archive = zipfile.ZipFile(io.BytesIO(payload))
          receipt = json.loads(archive.read('receipts/root-quick179.json'))
          assert receipt['commit'] == 'c5d11dd3e2c3420aa1fca61f9634a29f7295dfba'
          assert receipt['task'] == 'root-quick179'
          assert receipt['status'] == 'checked candidate; not registered in accepted roots'
          assert len(receipt['checked_project_modules']) == 44
          assert len(receipt['checks']) == 3
          print('RECEIPT_JSON docs/verification/five-speed-root-quick179-c5d11dd3.json ' + json.dumps(receipt, sort_keys=True, separators=(',', ':')), flush=True)
          print('PASS: original p179 archive matches pinned SHA256 and exact receipt metadata')
          PY
