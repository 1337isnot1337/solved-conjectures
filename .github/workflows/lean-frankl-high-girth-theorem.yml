permissions:
  contents: read

jobs:
  frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Strict source, every owned declaration, exact stock kernel
        run: python3 scripts/verify_frankl_high_girth_theorem.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-high-girth-theorem
          path: .candidate-artifacts/frankl-high-girth-theorem/
          retention-days: 14
