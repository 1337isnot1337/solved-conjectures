name: Compose exact Frankl transport Results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-frankl-transport-results.yml'
      - 'scripts/verify_frankl_transport_results.py'
      - 'scripts/test_frankl_transport_results.py'
      - 'scripts/preserve_frankl_transport_receipts.py'
      - 'scripts/test_frankl_transport_receipts.py'
      - 'lean/Conjectures/FranklSmallCyclicTransportResults.lean'
  workflow_run:
    workflows:
      - Lean Frankl source-grouped transport batches
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: frankl-transport-results-${{ github.event.workflow_run.id || 44513150579 }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.id == 44513150579 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: identity
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check archive composition and frozen exact closure
        run: |
          python3 -m py_compile scripts/verify_frankl_transport_results.py scripts/test_frankl_transport_results.py
          python3 -m unittest discover -s scripts -p test_frankl_transport_results.py -v
          mkdir -p .candidate-artifacts
          python3 scripts/verify_frankl_transport_results.py --plan --plan-output .candidate-artifacts/frankl-transport-results-plan.json
      - id: ready
        name: Require complete successful original dependency runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_frankl_transport_results.py --readiness
      - uses: actions/upload-artifact@v4
        with:
          name: frankl-transport-results-plan
          path: .candidate-artifacts/frankl-transport-results-plan.json
          include-hidden-files: true
          retention-days: 14
  verify:
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Validate original objects and freshly check Results
        env:
          GH_TOKEN: ${{ github.token }}
          LEAN_NUM_THREADS: 1
        run: python3 scripts/verify_frankl_transport_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-transport-results-composed
          path: .candidate-artifacts/frankl-transport-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
