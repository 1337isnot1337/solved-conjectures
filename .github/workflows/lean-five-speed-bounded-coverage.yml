      - 'scripts/verify_lean_candidate.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: five-speed-bounded-coverage-${{ github.sha }}
  cancel-in-progress: false

env:
  LEAN_NUM_THREADS: '1'
  UV_USE_IO_URING: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check archive mutations and private proof inventory
        run: python3 scripts/test_five_speed_bounded_coverage.py
      - name: Confirm the exact current source closure
        run: python3 scripts/verify_five_speed_bounded_coverage.py --plan
      - name: Recover the eight immutable historical receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_five_speed_bounded_receipts.py --output-dir .candidate-artifacts/five-speed-bounded-coverage/history
      - name: Preserve historical recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-speed-bounded-history-44471625352
          path: .candidate-artifacts/five-speed-bounded-coverage/history/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Fresh source, all declarations, private proofs and exact stock replay
        run: python3 scripts/verify_five_speed_bounded_coverage.py
      - name: Preserve the complete candidate evidence
        id: proof-upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-speed-bounded-coverage
          path: .candidate-artifacts/five-speed-bounded-coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact receipts with source guards
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_five_speed_bounded_coverage.py --publish --artifact-id ${{ steps.proof-upload.outputs.artifact-id }}
