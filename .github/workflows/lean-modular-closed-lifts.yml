name: Lean modular closed lifts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-modular-closed-lifts.yml'
      - 'docs/modular-closed-lifts-sources.json'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessCoalescence.lean'
      - 'lean/Conjectures/LonelinessCoalescenceValue.lean'
      - 'lean/Conjectures/LonelinessContinuity.lean'
      - 'lean/Conjectures/LonelinessCoordinateClasses.lean'
      - 'lean/Conjectures/LonelinessCoordinateSubspace.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessCriticalFamilies.lean'
      - 'lean/Conjectures/LonelinessCriticalSecond.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessIntegerDirection.lean'
      - 'lean/Conjectures/LonelinessModularClosedFoldedDirections.lean'
      - 'lean/Conjectures/LonelinessModularClosedFoldedSearch.lean'
      - 'lean/Conjectures/LonelinessModularClosedShortVector.lean'
      - 'lean/Conjectures/LonelinessModularDirections.lean'
      - 'lean/Conjectures/LonelinessModularFoldedSearch.lean'
      - 'lean/Conjectures/LonelinessModularLift.lean'
      - 'lean/Conjectures/LonelinessModularNormalize.lean'
      - 'lean/Conjectures/LonelinessModularParity.lean'
      - 'lean/Conjectures/LonelinessModularPlaneGap.lean'
      - 'lean/Conjectures/LonelinessModularRationalWitness.lean'
      - 'lean/Conjectures/LonelinessModularSearch.lean'
      - 'lean/Conjectures/LonelinessModularSearchDirections.lean'
      - 'lean/Conjectures/LonelinessModularShortVector.lean'
      - 'lean/Conjectures/LonelinessModularStrictWitness.lean'
      - 'lean/Conjectures/LonelinessModularWitness.lean'
      - 'lean/Conjectures/LonelinessNormalization.lean'
      - 'lean/Conjectures/LonelinessRational.lean'
      - 'lean/Conjectures/LonelinessRationalSubspace.lean'
      - 'lean/Conjectures/LonelinessSubspaceDensity.lean'
      - 'lean/Conjectures/LonelinessTightSevenPrime251Binary.lean'
      - 'lean/Conjectures/LonelinessTightSevenPrime251BinaryChecks.lean'
      - 'lean/Conjectures/LonelinessTightSevenPrime251BinaryData.lean'
      - 'lean/lake-manifest.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/generate_modular_closed_lifts.py'
      - 'scripts/generate_modular_initial_support.py'
      - 'scripts/generate_modular_support_multiplicities.py'
      - 'scripts/generate_six_speed_prime_arithmetic.py'
      - 'scripts/generate_six_speed_prime_assembly.py'
      - 'scripts/generate_six_speed_prime_certificates.py'
      - 'scripts/generate_six_speed_prime_fast.py'
      - 'scripts/plan_accepted_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/replay_lean.py'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/verify_modular_closed_lifts.py'
      - 'scripts/verify_six_speed_prime_batches.py'
      - 'scripts/verify_six_speed_prime_pipeline.py'

permissions:
  contents: read

concurrency:
  group: lean-modular-closed-lifts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Check the exact numerical and source model
        run: |
          python3 -m py_compile scripts/generate_modular_closed_lifts.py scripts/verify_modular_closed_lifts.py
          python3 scripts/generate_modular_closed_lifts.py --self-test
          python3 scripts/verify_modular_closed_lifts.py --preflight
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Fresh strict source, all-owned audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_modular_closed_lifts.py
      - name: Preserve exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-closed-lifts-${{ github.sha }}
          path: .candidate-artifacts/modular-closed-lifts/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
