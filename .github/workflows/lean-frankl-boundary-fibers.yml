name: Lean Frankl boundary configuration fibers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-frankl-boundary-fibers.yml'
      - 'scripts/verify_frankl_boundary_fibers.py'
      - 'docs/frankl-boundary-fibers-sources.json'
      - 'lean/Conjectures/FranklBoundary*.lean'
      - 'lean/Conjectures/FranklTreeBall.lean'
      - 'lean/Conjectures/FranklIncidence.lean'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Strict source, every owned declaration, exact stock kernel
        run: python3 scripts/verify_frankl_boundary_fibers.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-boundary-fibers
          path: .candidate-artifacts/frankl-boundary-fibers/
          retention-days: 14
