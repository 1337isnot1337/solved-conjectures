name: Published-resolution Lean candidate (Danzer–Grunbaum)
on:
  push:
    paths:
      - 'lean/Conjectures/DanzerGrunbaumAcute.lean'
      - '.github/workflows/published-danzer-grunbaum-candidate.yml'
  pull_request:
    paths:
      - 'lean/Conjectures/DanzerGrunbaumAcute.lean'
      - '.github/workflows/published-danzer-grunbaum-candidate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Build, audit and replay
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from verify_lean_candidate import dependency_order, run, audit
          targets = ["Conjectures.DanzerGrunbaumAcute"]
          required = ["PublishedDanzerGrunbaum.distinct_points", "PublishedDanzerGrunbaum.integer_acute",
                      "PublishedDanzerGrunbaum.realPoints_injective", "PublishedDanzerGrunbaum.realPoints_acute",
                      "PublishedDanzerGrunbaum.conjecture_false"]
          modules = dependency_order(targets)
          for module in modules:
              run("lake", "build", module)
          audit(targets, required, modules, "published-danzer-grunbaum")
          for module in modules:
              run("lake", "env", "leanchecker", module)
          print("PASS: candidate source, axiom audit and kernel replay")
          PY
