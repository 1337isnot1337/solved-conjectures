name: Lean Frankl actual tree configuration messages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-frankl-tree-configuration-messages.yml'
      - 'scripts/verify_frankl_tree_configuration_messages.py'
      - 'docs/frankl-tree-configuration-messages-sources.json'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'lean/Conjectures/FranklIncidence.lean'
      - 'lean/Conjectures/FranklTreeCertificate.lean'
      - 'lean/Conjectures/FranklTreeCone.lean'
      - 'lean/Conjectures/FranklTreeConfigurationMessages.lean'
      - 'lean/Conjectures/FranklTreeConfigurations.lean'
      - 'lean/Conjectures/FranklTreeCounts.lean'
      - 'lean/Conjectures/FranklTreeGluing.lean'
      - 'lean/Conjectures/FranklTreeRoot.lean'
      - 'lean/Conjectures/FranklTreeSpan.lean'

permissions:
  contents: read

jobs:
  messages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Strict source, every owned declaration, exact stock kernel
        run: python3 scripts/verify_frankl_tree_configuration_messages.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-tree-configuration-messages
          path: .candidate-artifacts/frankl-tree-configuration-messages/
          include-hidden-files: true
          retention-days: 14
