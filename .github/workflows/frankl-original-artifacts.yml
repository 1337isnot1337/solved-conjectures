name: Preserve original Frankl dependency artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frankl-original-artifacts.yml'
      - 'scripts/preserve_frankl_original_artifacts.py'

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve frozen original receipts and validate archived hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_frankl_original_artifacts.py
