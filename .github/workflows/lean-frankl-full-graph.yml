permissions:
  contents: read

jobs:
  initial-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install public witness-producer dependencies
        run: python3 -m pip install numpy scipy
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Reproduce all sources, strict compile, full audit, and singleton stock replays
        run: python3 scripts/verify_frankl_full_graph.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankl-full-initial-graph
          path: |
            .candidate-artifacts/frankl-full-graph/
            .candidate-artifacts/frankl-full-graph-reproduction/
          if-no-files-found: error
          retention-days: 14
