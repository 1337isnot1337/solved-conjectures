permissions:
  contents: read

concurrency:
  group: lean-six-speed-prime0257-pilot
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Test private inventory, reproduce the exact b2 search and validate sources
        run: |
          python3 -m py_compile scripts/verify_six_speed_prime0257_pilot.py scripts/test_six_speed_prime0257_pilot.py
          python3 scripts/test_six_speed_prime0257_pilot.py
          node --check scripts/generate_six_speed_prime0257_pilot.mjs
          python3 scripts/verify_six_speed_prime0257_pilot.py --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict source, all-owned private audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_six_speed_prime0257_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-speed-prime0257-pilot
          path: .candidate-artifacts/six-speed-prime0257-pilot/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
