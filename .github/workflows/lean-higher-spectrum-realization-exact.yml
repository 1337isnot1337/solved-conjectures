name: Lean spectrum realizations and arithmetic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-higher-spectrum-realization-exact.yml'
      - 'scripts/verify_higher_spectrum_realization_exact.py'
      - 'docs/higher-spectrum-realization-exact-sources.json'
      - 'lean/Conjectures/LonelinessSixSpectrumArithmetic.lean'
      - 'lean/Conjectures/LonelinessSixSporadicBounds.lean'
      - 'lean/Conjectures/LonelinessSevenSpectrumRealization.lean'
      - 'lean/Conjectures/LonelinessEightSpectrumRealization.lean'
      - 'lean/Conjectures/LonelinessHigherSpectrumBounds.lean'
      - 'lean/Conjectures/Loneliness.lean'
      - 'lean/Conjectures/LonelinessCertificate.lean'
      - 'lean/Conjectures/LonelinessConsecutiveFamily.lean'
      - 'lean/Conjectures/LonelinessConsecutiveFamilyCertificates.lean'
      - 'lean/Conjectures/LonelinessCriticalBase.lean'
      - 'lean/Conjectures/LonelinessCriticalFamilies.lean'
      - 'lean/Conjectures/LonelinessCriticalSecond.lean'
      - 'lean/Conjectures/LonelinessExamples.lean'
      - 'lean/Conjectures/LonelinessExceptionalEightFamily.lean'
      - 'lean/Conjectures/LonelinessExceptionalEightFamilyCertificates.lean'
      - 'lean/Conjectures/LonelinessFiveFamily.lean'
      - 'lean/Conjectures/LonelinessHigherExamplesCertificate.lean'
      - 'lean/Conjectures/LonelinessHigherExamplesEight.lean'
      - 'lean/Conjectures/LonelinessHigherExamplesSeven.lean'
      - 'lean/Conjectures/LonelinessMax.lean'
      - 'lean/Conjectures/LonelinessNormalization.lean'
      - 'lean/Conjectures/LonelinessPairBridge.lean'
      - 'lean/Conjectures/LonelinessSixProgression.lean'
      - 'lean/Conjectures/LonelinessSixSpectrumRealization.lean'
      - 'scripts/verify_frankl_orbit_batches.py'
      - 'scripts/replay_lean.py'
      - 'scripts/plan_lean_candidates.py'
      - 'scripts/verify_lean_candidate.py'
      - 'scripts/audit_lean_all_owned.py'
      - 'scripts/build_lean_parallel.py'
      - 'scripts/plan_accepted_lean.py'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'

permissions:
  contents: read

concurrency:
  group: lean-higher-spectrum-realization-exact
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task: [six-arithmetic, seven-eight]
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact source and helper inventory
        run: |
          python3 -m py_compile scripts/verify_higher_spectrum_realization_exact.py
          python3 scripts/verify_higher_spectrum_realization_exact.py ${{ matrix.task }} --plan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          check-lean-environment: false
      - name: Fresh strict sources, all-owned audit and exact stock replay
        env:
          LEAN_NUM_THREADS: 1
          UV_USE_IO_URING: 0
        run: python3 scripts/verify_higher_spectrum_realization_exact.py ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: higher-spectrum-${{ matrix.task }}
          path: .candidate-artifacts/higher-spectrum-${{ matrix.task }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
