name: Preserve exact p199 root-cover proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preserve-five-speed-root199.yml'
      - 'scripts/preserve_five_speed_root199.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: preserve-five-speed-root199
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the immutable original verification snapshot
        run: git fetch --no-tags --depth=1 origin 497fa455595dcf900cd818d1941cb015140b7bb3
      - name: Validate fixed archive protocol fixtures
        run: |
          python3 -m py_compile scripts/preserve_five_speed_root199.py
          python3 scripts/preserve_five_speed_root199.py --self-test
      - name: Authenticate the generated sources and preserve the original proof evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_five_speed_root199.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-speed-root199-preservation
          path: .candidate-artifacts/five-speed-root199-preservation/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
