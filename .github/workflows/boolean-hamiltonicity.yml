name: check boolean hamiltonicity research lemmas

on:
  push:
    branches: [research]
    paths:
      - 'research/boolean-hamiltonicity/**'
      - '.github/workflows/boolean-hamiltonicity.yml'
  pull_request:
    branches: [research]
    paths:
      - 'research/boolean-hamiltonicity/**'
      - '.github/workflows/boolean-hamiltonicity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check cycle layers and restrictions
        run: python3 research/boolean-hamiltonicity/verify_layers.py
      - name: Check exact cut ranks and Boolean gate examples
        run: python3 research/boolean-hamiltonicity/verify_invariants.py
