permissions:
  contents: read

concurrency:
  group: five-runner-exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-theorem:
    name: Fresh full five-runner source, axiom and kernel gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
      UV_USE_IO_URING: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          check-lean-environment: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Reproduce every finite certificate and its exact source closure
        run: python3 scripts/verify_five_runner_exact.py --plan
      - name: Compile all current sources, audit every owned declaration, replay the exact closure
        working-directory: lean
        run: lake env python3 ../scripts/verify_five_runner_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-runner-exact-${{ github.sha }}
          path: .candidate-artifacts/five-runner-exact/
          include-hidden-files: 'true'
          if-no-files-found: error
          retention-days: 14
