name: Retire verified merged review refs 397 and 402
on:
  push:
    branches: [research]
    paths: [.github/workflows/retire-merged-reviews-397-402.yml]
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete only exact merged heads
        shell: bash
        run: |
          set -euo pipefail
          r1=refs/heads/review/feldheim-tail
          r2=refs/heads/review/waring-and-tail
          h1=6f69e3a88e7507eb6fe3ad90a1300f92ecd77393
          h2=9b35bdfbaee3a9d541a1ffe169953d0975f21c2e
          read -r a1 _ <<< "$(git ls-remote --heads origin "$r1")"
          read -r a2 _ <<< "$(git ls-remote --heads origin "$r2")"
          test "$a1" = "$h1" && test "$a2" = "$h2"
          git push --atomic --force-with-lease="$r1:$h1" --force-with-lease="$r2:$h2" origin ":$r1" ":$r2"
